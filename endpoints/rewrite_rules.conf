# nginx rewrite rules — auto-generated from OpenAPI annotations in endpoint_schema.sql.
# Run scripts/openapi_rewrite.sh to regenerate after changing endpoint paths.
# Specific rules must precede the default catch-all (first match wins in nginx).

# endpoint for get /v1/fyp/feed-metrics
rewrite ^/v1/fyp/feed-metrics$ /rpc/get_feed_metrics break;

# endpoint for get /v1/fyp/explain/{username}/{post_id}
rewrite ^/v1/fyp/explain/([^/]+)/([^/]+)$ /rpc/get_score_explanation?username=$1&post_id=$2 break;

# endpoint for get /v1/fyp/profile/{username}
rewrite ^/v1/fyp/profile/([^/]+)$ /rpc/get_user_profile?username=$1 break;

# endpoint for get /v1/fyp/global
rewrite ^/v1/fyp/global$ /rpc/get_global_feed break;

# endpoint for get /v1/fyp/feed/{username}
rewrite ^/v1/fyp/feed/([^/]+)$ /rpc/get_personalized_feed?username=$1 break;

# endpoint for get /v1/fyp/algorithms
rewrite ^/v1/fyp/algorithms$ /rpc/list_algorithm_versions break;

# endpoint for get /v1/fyp/algorithm
rewrite ^/v1/fyp/algorithm$ /rpc/get_algorithm break;

# endpoint for get /sync-status
rewrite ^/sync-status$ /rpc/get_sync_status break;

# endpoint for get /health
rewrite ^/health$ /rpc/get_health break;

# endpoint for get /version
rewrite ^/version$ /rpc/get_version break;

# endpoint for openapi spec itself
rewrite ^/$ / break;

# default endpoint for everything else
rewrite ^/(.*)$ /rpc/$1 break;

version: "3.8"

# Project name pinned (#53). In GitLab CI this runs in a fresh docker-in-docker service,
# but scripts/run_tests.sh runs it on the host, where the unpinned default -- this file's
# directory, `docker` -- is shared with the standalone stack of a pre-#53 checkout and any
# other `docker/`-directory stack. Its first command is `down -v --remove-orphans`, which
# under a shared project removes every container of it: this file's own services --
# including a stack's same-named haf-fyp-postgrest and rewriter -- and every orphan.
# scripts/run_tests.sh also passes `-p haf_fyp_ci`, which outranks a COMPOSE_PROJECT_NAME
# in the shell.
name: haf_fyp_ci

# CI test stack — plain postgres with pgvector (no HAF replay needed).
# Tests all PostgREST endpoint functions against seeded app tables.
#
# Usage (from haf_fyp/):
#   ./scripts/run_tests.sh              # run tests, tear down on exit
#   ./scripts/run_tests.sh --keep       # leave stack running after tests
#
# Do NOT use --abort-on-container-exit — the setup container exits normally
# after running SQL, which would abort postgrest before tavern finishes.
# The script uses detached mode + "docker compose wait tavern" instead.

services:
  postgres:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_DB: haf_block_log
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haf_block_log"]
      interval: 3s
      timeout: 2s
      retries: 20

  setup:
    image: postgres:14-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /haf_stub.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_setup.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /app_version.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /builtin_roles.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /create_tables.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -v git_hash=ci-test -f /set_version.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /seed_data.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -c "SET custom.swagger_url = 'localhost';" -f /endpoint_schema.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /active_users_maintenance.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /sync_status.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /cross_schema_grants.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL TABLES IN SCHEMA haf_fyp_app TO haf_fyp_user; GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA haf_fyp_endpoints TO haf_fyp_user;" &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /create_tables.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /app_version.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /active_users_maintenance.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /sync_status.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /cross_schema_grants.sql &&
        PGOPTIONS="-c role=ci_restricted_installer" PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /cross_schema_grants.sql > /tmp/restricted.log 2>&1; __rc=$$?; cat /tmp/restricted.log; [ "$$__rc" -eq 0 ] &&
        grep -q "could not set default privileges for owner role" /tmp/restricted.log &&
        grep -q "Self-healing incomplete" /tmp/restricted.log &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_test_hooks.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_privileges.sql &&
        PGPASSWORD=postgres psql -h postgres -U postgres -d haf_block_log -v ON_ERROR_STOP=1 -f /ci_invariants.sql
    volumes:
      # #16: HAF core stand-in, shared with the fastapi-tests lane so the two
      # cannot drift. Must load BEFORE ci_setup.sql, which adds the RLS policy and
      # grants on top of these tables.
      - ../tests/haf_stub.sql:/haf_stub.sql:ro
      - ../tests/ci_setup.sql:/ci_setup.sql:ro
      # CI-only: lets a tavern stage drive the stub's readiness flag over HTTP so
      # the documented 503 contract is asserted rather than only described.
      - ../tests/ci_test_hooks.sql:/ci_test_hooks.sql:ro
      # #20: the SHIPPED app_version DDL, not a copy. This lane does not load
      # db/haf_fyp_app.sql, which is why this table's DDL lives in its own file -- so
      # tests/ci_invariants.sql probes the product rather than restating its own fixture.
      # Since #65 that is a CHOICE rather than an impossibility: tests/haf_stub.sql gained
      # the context lifecycle, and the integration lane loads db/haf_fyp_app.sql against it.
      # The split stays regardless -- it is what lets this lane assert the shipped DDL.
      - ../db/app_version.sql:/app_version.sql:ro
      # The SAME file scripts/install_app.sh step 15 runs -- not a copy of it -- invoked here
      # with a known hash so the tavern checks can assert a concrete /version body.
      - ../scripts/set_version.sql:/set_version.sql:ro
      # #16: the SHIPPED role file, run right after the fixture. ci_setup.sql
      # creates the HAF group stand-ins but deliberately grants no memberships, so
      # the group membership tests/ci_privileges.sql depends on comes from this
      # product file. Without it that probe would only restate its own fixture.
      - ../db/builtin_roles.sql:/builtin_roles.sql:ro
      # #16: the SECURITY DEFINER reader tests/ci_privileges.sql probes. Applied in
      # both install passes, like create_tables.sql, so a non-idempotent edit fails
      # here rather than on the next deploy.
      - ../db/sync_status.sql:/sync_status.sql:ro
      # #8: the self-healing cross-schema grant pass, as a real product file. It had
      # never run in any lane -- so its ALTER DEFAULT PRIVILEGES loop, which exists to
      # keep the Discover feed alive across a foreign app's upgrade, was untested.
      # tests/ci_setup.sql stands up the foreign schemas it needs (reptracker_app owned
      # by two non-installer roles, plus an unhealed_app negative control) and
      # tests/haf_stub.sql supplies hafd.accounts, which this file grants on UNGUARDED
      # and whose absence is why the file could not be loaded here before.
      #
      # Applied TWICE, like create_tables.sql and sync_status.sql: the file's header
      # promises "Safe to re-run", and install_app.sh loads it on every install, so a
      # non-idempotent edit should fail here rather than on the next deploy.
      - ../db/cross_schema_grants.sql:/cross_schema_grants.sql:ro
      - ../db/create_tables.sql:/create_tables.sql:ro
      - ../db/seed_data.sql:/seed_data.sql:ro
      - ../endpoints/endpoint_schema.sql:/endpoint_schema.sql:ro
      # #10: the only lane with real restricted (non-superuser) roles and a real
      # superuser installer, so it is the only place the maintenance grants footer
      # and the privilege assertions can actually be exercised.
      #
      # create_tables.sql and active_users_maintenance.sql are applied TWICE on
      # purpose — a REINSTALL check, matching what haf_block_explorer covers in its
      # setup-scripts-test job (this repo has no functional lane, and adding one just
      # for this would be a new CI job for a single assertion). Both files are
      # re-run-on-every-install by design, so a non-idempotent edit — a bare ALTER, a
      # CREATE without IF NOT EXISTS, a one-time data fixup that fires twice — fails
      # the pipeline here instead of the next production deploy. ci_privileges.sql
      # runs LAST, after every GRANT/REVOKE and after the reinstall.
      - ../db/active_users_maintenance.sql:/active_users_maintenance.sql:ro
      - ../tests/ci_privileges.sql:/ci_privileges.sql:ro
      # Cross-cutting state invariants (context pointer vs app_status, app_status
      # singleton). Runs after ci_privileges.sql, so it sees the fully installed,
      # re-installed and re-granted database.
      - ../tests/ci_invariants.sql:/ci_invariants.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  haf-fyp-postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: "postgres://postgres:postgres@postgres/haf_block_log"
      PGRST_DB_SCHEMA: "haf_fyp_endpoints"
      PGRST_DB_ANON_ROLE: "haf_fyp_user"
      # The deployment sets this (PGRST_DB_ROOT_SPEC=root on haf-haf-fyp-postgrest-1)
      # and CI did not, so GET / served PostgREST's own auto-generated Swagger here
      # while serving haf_fyp_endpoints.root()'s OpenAPI document in production --
      # and root(), a shipped endpoint, was exercised by nothing. Without it the
      # `^/$` rewrite rule cannot be tested for what it actually does.
      PGRST_DB_ROOT_SPEC: "root"
      PGRST_DB_POOL: "5"
    depends_on:
      setup:
        condition: service_completed_successfully

  # The rewriter, built from the SHIPPED Dockerfile -- not a stand-in. Without a
  # lane that requests a public path through it, endpoints/rewrite_rules.conf is
  # built into an image and never exercised: removing the /sync-status rule, moving
  # it after the catch-all, or typo'ing its target all leave the suite green while
  # HAProxy marks the backend DOWN. Verified: all three mutations pass CI without
  # this service.
  haf-fyp-postgrest-rewriter:
    build:
      context: ..
      dockerfile: Dockerfile.rewriter
    environment:
      POSTGREST_HOST: haf-fyp-postgrest
      POSTGREST_PORT: 3000
      # Without this the entrypoint writes `# rewrite_log off;` and the access log
      # prints the ORIGINAL request line, not the rewritten target -- so `logs
      # rewriter` in CI shows the status code the tavern stage already reported and
      # cannot separate "the rule is wrong" from "the function is broken".
      REWRITE_LOG: "on"
    depends_on:
      - haf-fyp-postgrest

  tavern:
    image: python:3.12-slim
    command: >
      sh -c "pip install tavern==3.6.3 -q &&
             pytest /tests/tavern/test_endpoints.tavern.yaml /tests/tavern/rewriter/ --tb=short -v"
    volumes:
      - ../tests/tavern:/tests/tavern:ro
    environment:
      API_URL: "http://haf-fyp-postgrest:3000"
      # The public path an operator (and HAProxy) actually requests.
      REWRITER_URL: "http://haf-fyp-postgrest-rewriter"
      FASTAPI_URL: "http://localhost:9999"
    depends_on:
      - haf-fyp-postgrest
      - haf-fyp-postgrest-rewriter

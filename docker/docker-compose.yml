version: "3.8"

# Full production stack:
#   haf                — HAF PostgreSQL node (hived + sql_serializer)
#   haf-fyp-setup      — One-time schema installation (runs as haf_admin)
#   haf-fyp-sync       — Infinite block-processing loop (PL/pgSQL main())
#   haf-fyp-ranker     — Python ranking daemon (5-minute cycles)
#   haf-fyp-api        — FastAPI overlay (rate limiting, force-refresh, explainer)
#   postgrest          — Auto-generated REST API over haf_fyp_endpoints schema
#   redis              — Pub/sub for force-refresh signals

services:
  haf:
    image: ${HAF_REGISTRY}/haf/instance:${HAF_VERSION}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - haf_datadir:/home/hived/datadir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U haf_admin -d haf_block_log"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 72h   # replay can take days on first run

  haf-fyp-setup:
    build:
      context: ..
      dockerfile: Dockerfile.sql
      args:
        # Baked into the image as ENV GIT_HASH; install_app.sh step 15 writes it into
        # haf_fyp_app.app_version so GET /version names the running commit (#20). Unset
        # makes that step record the placeholder from db/app_version.sql instead. `:-`
        # rather than `-` so compose-validate, which sets no GIT_HASH, interpolates cleanly.
        GIT_HASH: ${GIT_HASH:-}
    command: ["/app/scripts/install_app.sh"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin   # install requires DDL privileges
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf:
        condition: service_healthy
    restart: on-failure

  haf-fyp-sync:
    build:
      context: ..
      dockerfile: Dockerfile.sql
      args:
        # Same Dockerfile as haf-fyp-setup; passed here too so the two images stay
        # identical rather than differing only in a baked ENV.
        GIT_HASH: ${GIT_HASH:-}
    command: ["/app/scripts/process_blocks.sh"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_fyp_owner
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "psql -h haf -U haf_fyp_user -d haf_block_log -c 'SELECT 1' -q"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 72h

  haf-fyp-ranker:
    build:
      context: ..
      dockerfile: Dockerfile.python
    command: ["python", "-m", "haf_fyp.ranker_daemon"]
    environment:
      POSTGRES_HOST: haf
      # #14: the ranker/maintenance daemon connects as haf_fyp_owner (owns the app
      # schema -> implicit write/rollup/prune privileges). This keeps the daemon's
      # DELETE/maintenance rights off haf_fyp_user, the role the unauthenticated
      # PostgREST + FastAPI api run as.
      POSTGRES_USER: haf_fyp_owner
      POSTGRES_DB:   haf_block_log
      REDIS_HOST:    redis
      REDIS_URL:     redis://redis:6379
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  haf-fyp-api:
    build:
      context: ..
      dockerfile: Dockerfile.python
    command: ["uvicorn", "haf_fyp.api:app", "--host", "0.0.0.0", "--port", "3002"]
    ports:
      # Loopback-bound on purpose. Published on all interfaces this port bypasses the
      # edge entirely, and the rate limiter's X-Real-IP would then be settable by any
      # caller -- a fresh bucket per request, i.e. no limit at all. See client_ip_key
      # in haf_fyp/api.py. Nothing needs the host mapping: other services reach this
      # container by name on the compose network.
      - "127.0.0.1:${FYP_API_PORT:-3002}:3002"
    environment:
      # Peers whose X-Real-IP the rate limiter will trust -- the edge, and nothing
      # else. Accepts addresses or CIDR (the edge container's address is usually
      # assigned dynamically). EMPTY BY DEFAULT: unset means no edge, and limits
      # degrade to keying on the socket peer rather than on a forgeable header.
      # Leaving it unset behind a proxy silently restores the one-global-bucket bug
      # this exists to fix, so set it wherever an edge is in front.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_fyp_user
      POSTGRES_DB:   haf_block_log
      REDIS_HOST:    redis
      REDIS_URL:     redis://redis:6379
      ADMIN_API_KEY: "${FYP_ADMIN_API_KEY}"
      # TRUSTED Hive RPC for interest-write signature verification. Defaults to
      # the local hived; never a public API (a hostile node can forge posting
      # keys and bypass auth). Unset ⇒ interest writes fail closed (503).
      HIVE_RPC_URL:  "${HIVE_RPC_URL:-http://haf:8091}"
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:${POSTGREST_VERSION}
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3000"
    environment:
      PGRST_DB_URI:                "postgres://haf_fyp_user@haf/haf_block_log"
      PGRST_DB_SCHEMA:             "haf_fyp_endpoints"
      PGRST_DB_ANON_ROLE:          "haf_fyp_user"
      PGRST_DB_POOL:               "20"
      PGRST_DB_POOL_TIMEOUT:       "10"
      PGRST_SERVER_TIMING_ENABLED: "true"
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  haf_datadir:
  redis_data:

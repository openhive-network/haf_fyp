version: "3.8"

# The project name, pinned (#53). Unpinned it was this file's directory, `docker` -- shared
# by every stack started from a `docker/` directory on the host. Compose identifies
# containers, networks and volumes by project and name, so those stacks recreated each
# other's same-named services and removed each other's containers on --remove-orphans.
# `-p` and COMPOSE_PROJECT_NAME still override it. haf_stats pins `haf_stats` likewise.
name: haf_fyp

# Full production stack:
#   haf                        — HAF PostgreSQL node (hived + sql_serializer)
#   haf-fyp-setup              — One-time schema installation (runs as haf_admin)
#   haf-fyp-sync               — Infinite block-processing loop (PL/pgSQL main())
#   haf-fyp-ranker             — Python ranking daemon (5-minute cycles)
#   haf-fyp-api                — FastAPI overlay (rate limiting, force-refresh, explainer)
#   haf-fyp-postgrest          — Auto-generated REST API over haf_fyp_endpoints schema
#   haf-fyp-postgrest-rewriter — Public read API: clean /v1/fyp/... paths (#38)
#   haf-fyp-redis              — Pub/sub for force-refresh signals, and rate-limit storage
#
# ─────────────────────────────────────────────────────────────────────────────────────
# THIS FILE IS THE STANDALONE STACK. (#48) NEVER COMBINE IT WITH A NODE'S COMPOSE FILES,
# AND NEVER RUN IT UNDER A NODE'S PROJECT NAME.
#
# A haf_api_node runs apps from module yamls, not from an app repo's docker-compose.yml.
# Upstream's compose.yml is `name: ${PROJECT_NAME}` plus an `include:` of its own module
# files — on develop, e.g. haf_stats.yaml: haf-stats-* services, POSTGRES_HOST: haf — and
# no app repo's compose file appears in it on develop or master. haf_fyp has no upstream
# module: the node that runs it keeps a private module file OUTSIDE `include:` and runs
# it on its own under the node's project name (`docker compose -p haf -f <module>`).
#
# The distinction is load-bearing, because compose identifies a service by project and
# name: a same-named service from another file is not a second service. Measured with
# this file's `haf` against haf_api_node's (develop):
#
#   -p <node's project> -f <this file>   the node's `haf` container is RECREATED from
#                                        this file's definition — its image, its ports,
#                                        an empty project volume for the datadir.
#   -f compose.yml -f <this file>        merged: the later file wins image, healthcheck
#                                        and same-target mounts (the datadir bind becomes
#                                        an EMPTY named volume), and 5432 is published.
#                                        Silent on every version measured from v2.21.0 to
#                                        v5.5.1, except v2.24.0–v2.24.5, which refuse.
#   include: [..., <this file>]          refused on every v2 measured (v2.20.0–v2.40.3:
#                                        "defines conflicting service" before v2.24,
#                                        "conflicts with imported resource" from it);
#                                        merged silently on v5.0.0–v5.5.1, adding 5432
#                                        and a restart policy to the node's `haf`.
#
# So: every service here carries the `haf-fyp-` prefix, and the exceptions are deliberate:
#
#   haf        — named to MATCH haf_api_node's service. It is what makes POSTGRES_HOST: haf
#                correct in both this stack and a node module, so the app's config is
#                portable between them. Renaming it would NOT make any of the above safe.
#                Layered, a renamed service is simply added: a SECOND, empty HAF, with
#                every haf-fyp-* service that connects to PostgreSQL pointed at it. Under
#                the node's project name, the prefix protects nothing either — this
#                file's haf-fyp-* services would recreate the node's same-named haf_fyp
#                containers and add the rest alongside. And renaming has an upgrade
#                hazard of its own: the running
#                `haf` container is orphaned, not renamed, while the new service mounts
#                the same haf_datadir volume.
#   volumes    — the keys haf_datadir / redis_data are generic and combine by key the same
#                way; kept, because this file is never combined with a node's. Since #53
#                the volume NAMES on the host follow the project, with an override for an
#                upgraded stack (see `volumes:` at the end).
#
# The same collision exists one level up, on a single host, which is why this file pins
# `name: haf_fyp` (#53): unpinned, the project was the compose file's directory, `docker`,
# shared by every stack started from a `docker/` directory.
#
# tests/unit/test_compose_contract.py pins both rules, so a NEW generic service or volume
# cannot appear without this being revisited.
#
# No `networks:` key is declared, so services land on the project's implicit default
# network and resolve each other by name — correct for a standalone stack. Upstream app
# modules such as haf_stats.yaml declare `networks: [haf-network]` because they DO share a
# node network.
# ─────────────────────────────────────────────────────────────────────────────────────

services:
  haf:
    # `haf`, not `haf/instance` (#56). haf's CI has published nothing to .../haf/instance
    # since April 2025 -- its newest tag there is 1.27.11rc3 -- and puts the instance
    # image in .../haf instead, the repository haf_api_node's haf_base.yaml reads too
    # (`${HAF_IMAGE:-${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf}`, i.e. the same
    # name under whichever registry a node is pointed at). That path still holds 1.27.x
    # tags, but every tag this stack has ever pinned 404s there: a fresh `up` fails, and
    # a host that already has the image cached keeps working until it pulls again.
    # tests/unit/test_compose_contract.py pins the path and the shape of the tag.
    image: ${HAF_REGISTRY}/haf:${HAF_VERSION}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - haf_datadir:/home/hived/datadir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U haf_admin -d haf_block_log"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 72h   # replay can take days on first run
    # As haf_api_node's haf_base.yaml does: compose's default ten seconds is not enough for
    # PostgreSQL to shut down cleanly, and a SIGKILL after it makes the next start perform
    # crash recovery. It is stored on the container when compose creates it, so it applies to
    # `stop`, `down` and a recreate of containers created from this file. An older container
    # keeps the ten seconds until it is replaced: stop one with `docker stop -t 120` first.
    stop_grace_period: 2m

  haf-fyp-setup:
    build:
      context: ..
      dockerfile: Dockerfile.sql
      args:
        # Baked into the image as ENV GIT_HASH; install_app.sh step 15 writes it into
        # haf_fyp_app.app_version so GET /version names the running commit (#20). Unset
        # makes that step record the placeholder from db/app_version.sql instead. `:-`
        # rather than `-` so compose-validate, which sets no GIT_HASH, interpolates cleanly.
        GIT_HASH: ${GIT_HASH:-}
    # NOTE: these services have `build:` and no `image:`, so a plain `up -d` reuses the
    # cached image from whatever was built last. Moving from a script path to a verb
    # therefore needs `--build` on the first run after this change -- without it an
    # image built from develop gets `install_app` as a command it cannot find, exits
    # 127, and `restart: on-failure` loops while every other service waits forever on
    # service_completed_successfully.
    #
    # A verb, not a path (#27) -- the image's entrypoint dispatches it. Spelled this
    # way here, rather than only in a future module file, so the reference stack uses
    # the same form a module would. Note what that does NOT buy: compose-validate only
    # runs `docker compose config`, which parses YAML and never starts a container, and
    # the postgrest lane builds nothing from Dockerfile.sql. Nothing in CI executes the
    # dispatcher inside the image; tests/unit/test_docker_entrypoint.py is what covers
    # it, by running the script directly against stub scripts.
    command: ["install_app"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin   # install requires DDL privileges
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf:
        condition: service_healthy
    restart: on-failure

  haf-fyp-sync:
    build:
      context: ..
      dockerfile: Dockerfile.sql
      args:
        # Same Dockerfile as haf-fyp-setup; passed here too so the two images stay
        # identical rather than differing only in a baked ENV.
        GIT_HASH: ${GIT_HASH:-}
    command: ["process_blocks"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_fyp_owner
      POSTGRES_DB:   haf_block_log
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    # Declared here rather than in Dockerfile.sql -- see the note there. This is the
    # only service the check describes; the other two built from the same image run
    # once and exit.
    #
    # What it replaces: `psql ... -c 'SELECT 1'`, which proved PostgreSQL answers and
    # said nothing about whether haf_fyp_app.main() was still advancing. The loop is
    # infinite; when it wedged, that check kept reporting healthy.
    #
    # start_period covers a first run against a fresh HAF, which replays the whole
    # chain in MASSIVE iterations of up to 10,000 blocks -- and the heartbeat does not
    # move until an iteration finishes, so a long batch can exceed MAX_AGE on a replay
    # that is perfectly healthy.
    #
    # 72h is inherited from the SELECT 1 check this replaces and is NOT a considered
    # number for the new one. Docker >= 25 ends the start period at the first success,
    # so it does not in fact cover a whole replay; on older Docker it means a restarted
    # service can never report unhealthy for three days, which is the silent window
    # #27 exists to close. It is left alone here because nothing yet consumes this
    # service's health -- no depends_on keys on it, and the node's status page uses the
    # HAProxy agent-check instead -- so tuning it without a measured MASSIVE batch
    # duration would be guessing twice.
    healthcheck:
      test: ["CMD", "/app/block-processing-healthcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 72h

  # Removes haf_fyp from the database: HAF context, both schemas (CASCADE), both
  # roles. Behind a profile, so `docker compose up` never starts it.
  #
  #     docker compose --env-file docker/.env.local -f docker/docker-compose.yml \
  #         stop haf-fyp-sync haf-fyp-ranker haf-fyp-api haf-fyp-postgrest
  #     docker compose --env-file docker/.env.local -f docker/docker-compose.yml \
  #         run --rm haf-fyp-uninstall
  #
  # --env-file on BOTH: `run` recreates a dependency whose config differs, so if .env.local
  # pins HAF_VERSION/HAF_REGISTRY, leaving it off recreates `haf` from docker/.env just
  # before the teardown. That got sharper with #56: this file's pin now RESOLVES, so the
  # recreate succeeds on a different HAF instead of failing on the pull -- and on a synced
  # datadir a HAF from another line refuses to start at all (docker/.env, HAF_VERSION). Add the stack's -p to both if it runs under one. A stack started
  # before #53 without -p or COMPOSE_PROJECT_NAME runs its old containers under the project
  # `docker`, which `stop` here does not reach: scripts/upgrade_standalone_stack.sh removes
  # them (by label -- not --remove-orphans, which removes far more).
  #
  # USE `run --rm`, NOT `--profile haf-fyp-uninstall up`. Upstream documents the `up`
  # form and it is safe THERE because upstream puts every app service behind a profile
  # too. In THIS file nothing else has `profiles:`, so `up` would also start
  # haf-fyp-setup -- whose command is `install_app` -- concurrently with the teardown,
  # racing DROP SCHEMA against CREATE SCHEMA, and restart the very services the operator
  # was just told to stop. The session guard cannot see it either: haf-fyp-setup
  # connects as haf_admin, and the guard counts only haf_fyp_owner/haf_fyp_user.
  # `run` starts only this service and its depends_on.
  #
  # --force is passed so the run is non-interactive; `docker compose run` does allocate
  # a TTY, so dropping it would make the script prompt. Run scripts/uninstall_app.sh
  # directly without --force to get the type-the-database-name confirmation.
  #
  # Stopping the other services first is not optional: the script refuses while anything
  # is connected as a haf_fyp role, because DROP SCHEMA CASCADE needs an
  # AccessExclusiveLock and would otherwise block behind the ranker rather than fail.
  #
  # DESTRUCTIVE AND IRREVERSIBLE -- it drops the ranker's whole history, which only a
  # full reprocess rebuilds.
  haf-fyp-uninstall:
    profiles: ["haf-fyp-uninstall"]
    build:
      context: ..
      dockerfile: Dockerfile.sql
      args:
        # Same build args as the other two services from this Dockerfile, so its build hits
        # their cached layers rather than rebuilding for a different baked ENV. Compose
        # still tags one image per service.
        GIT_HASH: ${GIT_HASH:-}
    command: ["uninstall_app", "--force"]
    environment:
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_admin   # dropping roles needs more than haf_fyp_owner
      POSTGRES_DB:   haf_block_log
    depends_on:
      # Without this, `run --rm haf-fyp-uninstall` against a stopped stack does not
      # start haf and sits in wait_for_postgres -- an unbounded `until pg_isready`
      # loop -- forever, with no message.
      haf:
        condition: service_healthy

  haf-fyp-ranker:
    build:
      context: ..
      dockerfile: Dockerfile.python
    command: ["python", "-m", "haf_fyp.ranker_daemon"]
    environment:
      POSTGRES_HOST: haf
      # #14: the ranker/maintenance daemon connects as haf_fyp_owner (owns the app
      # schema -> implicit write/rollup/prune privileges). This keeps the daemon's
      # DELETE/maintenance rights off haf_fyp_user, the role the unauthenticated
      # PostgREST + FastAPI api run as.
      POSTGRES_USER: haf_fyp_owner
      POSTGRES_DB:   haf_block_log
      REDIS_HOST:    ${REDIS_HOST:-haf-fyp-redis}
      REDIS_PORT:    ${REDIS_PORT:-6379}
      REDIS_URL:     ${REDIS_URL:-redis://haf-fyp-redis:6379}
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully
      haf-fyp-redis:
        condition: service_started
    restart: unless-stopped

  haf-fyp-api:
    build:
      context: ..
      dockerfile: Dockerfile.python
    command: ["uvicorn", "haf_fyp.api:app", "--host", "0.0.0.0", "--port", "3002"]
    ports:
      # Loopback-bound on purpose. Published on all interfaces this port bypasses the
      # edge entirely, and the rate limiter's X-Real-IP would then be settable by any
      # caller -- a fresh bucket per request, i.e. no limit at all. See client_ip_key
      # in haf_fyp/api.py. Nothing needs the host mapping: other services reach this
      # container by name on the compose network.
      - "127.0.0.1:${FYP_API_PORT:-3002}:3002"
    environment:
      # Peers whose X-Real-IP the rate limiter will trust -- the edge, and nothing
      # else. Accepts addresses or CIDR (the edge container's address is usually
      # assigned dynamically). EMPTY BY DEFAULT: unset means no edge, and limits
      # degrade to keying on the socket peer rather than on a forgeable header.
      # Leaving it unset behind a proxy silently restores the one-global-bucket bug
      # this exists to fix, so set it wherever an edge is in front.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      POSTGRES_HOST: haf
      POSTGRES_USER: haf_fyp_user
      POSTGRES_DB:   haf_block_log
      REDIS_HOST:    ${REDIS_HOST:-haf-fyp-redis}
      REDIS_PORT:    ${REDIS_PORT:-6379}
      REDIS_URL:     ${REDIS_URL:-redis://haf-fyp-redis:6379}
      # FORWARDED DELIBERATELY. api.py reads HAF_FYP_ENABLE_DOCS at import to decide
      # whether /docs, /redoc and /openapi.json exist, and the README tells operators
      # to set it for local development -- but compose passes NOTHING into a container
      # that is not named here. Without this line the documented escape hatch silently
      # does nothing: putting it in .env.local sets it for INTERPOLATION only, the
      # container starts with docs off, and the developer gets 404s with no
      # explanation. Empty default so the production behaviour is unchanged.
      HAF_FYP_ENABLE_DOCS: ${HAF_FYP_ENABLE_DOCS:-}
      ADMIN_API_KEY: "${FYP_ADMIN_API_KEY}"
      # TRUSTED Hive RPC for interest-write signature verification. Defaults to
      # the local hived; never a public API (a hostile node can forge posting
      # keys and bypass auth). Unset ⇒ interest writes fail closed (503).
      HIVE_RPC_URL:  "${HIVE_RPC_URL:-http://haf:8091}"
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully
      haf-fyp-redis:
        condition: service_started
    restart: unless-stopped

  haf-fyp-postgrest:
    image: postgrest/postgrest:${POSTGREST_VERSION}
    restart: unless-stopped
    # Moved off 3001, which the rewriter now owns. PostgREST stays published so the raw
    # /rpc/ surface is still reachable for debugging -- the rewriter cannot serve it,
    # because its generated catch-all (`rewrite ^/(.*)$ /rpc/$1`) would turn
    # /rpc/get_health into /rpc/rpc/get_health.
    ports:
      - "${POSTGREST_HOST_PORT:-3000}:3000"
    environment:
      PGRST_DB_URI:                "postgres://haf_fyp_user@haf/haf_block_log"
      PGRST_DB_SCHEMA:             "haf_fyp_endpoints"
      PGRST_DB_ANON_ROLE:          "haf_fyp_user"
      # Serve haf_fyp_endpoints.root()'s OpenAPI document at /, matching the deployment
      # and docker-compose-ci.yml. Without it the rewriter's `^/$` rule returns
      # PostgREST's auto-generated swagger, which advertises the /rpc/ surface that this
      # port cannot serve.
      PGRST_DB_ROOT_SPEC:          "root"
      PGRST_DB_POOL:               "20"
      PGRST_DB_POOL_TIMEOUT:       "10"
      PGRST_SERVER_TIMING_ENABLED: "true"
    depends_on:
      haf-fyp-setup:
        condition: service_completed_successfully

  # OPERATIONAL NOTE: after substitution the template is a literal
  # `proxy_pass http://haf-fyp-postgrest:3000` with no `resolver`, so nginx resolves that
  # name ONCE at startup and caches the IP for the process lifetime. Recreating
  # `haf-fyp-postgrest` (an image bump, --force-recreate) can give it a new IP -- Docker
  # often hands the same address back, so this may keep working by accident -- and when
  # it does change, this container fails every request -- a 502 once the connect to the stale address
  # fails, or a timeout to a client that gives up sooner -- while still reporting HEALTHY,
  # because the :81 probe is an
  # unconditional 204 that never touches the upstream. Restart the rewriter after anything
  # that recreates haf-fyp-postgrest.
  #
  # The public read API. Without this service `docker compose up` served bare PostgREST,
  # so every /v1/fyp/... path this repo documents -- in the README tables, in the OpenAPI
  # annotations, and in the spec served at / -- 404'd on the stack an operator actually
  # runs. Dockerfile.rewriter existed and CI published the image; nothing ran it. (#38)
  haf-fyp-postgrest-rewriter:
    image: ${HAF_FYP_REWRITER_IMAGE:-${HAF_FYP_REWRITER_REGISTRY:-registry.gitlab.syncad.com/hive}/haf_fyp/postgrest-rewriter:${HAF_FYP_REWRITER_VERSION:-develop}}
    build:
      context: ..
      dockerfile: Dockerfile.rewriter
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:80"
    environment:
      # Now AGREES with the image default. docker/rewriter_entrypoint.sh defaults
      # POSTGREST_HOST to `haf-fyp-postgrest`; until #48 this file named the service plain
      # `postgrest`, so the default resolved to nothing here and !65 had to override it.
      # The entrypoint's own comment offered the alternative -- "or rename the service to
      # match" -- and that is what #48 did. Kept explicit rather than deleted so a future
      # change to the image default cannot silently move this stack's upstream.
      POSTGREST_HOST: "${POSTGREST_HOST:-haf-fyp-postgrest}"
      POSTGREST_PORT: "${POSTGREST_PORT:-3000}"
    healthcheck:
      # The image serves /health on :81, a second server block separate from the :80
      # proxy, so this probes the container without going through PostgREST.
      test: ["CMD-SHELL", "wget --timeout=2 -nv -t1 --spider 127.0.0.1:81/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    depends_on:
      haf-fyp-postgrest:
        condition: service_started

  # NAMED haf-fyp-redis, NOT redis (#39).
  #
  # haf_api_node's jussi.yaml (included when the node runs jussi) defines a service
  # called `redis`. Combine this file with a node's -- which the header forbids, and
  # explains -- and two services of the same name become one, so the generic name would
  # have silently pointed this app at jussi's instance.
  #
  # That is not merely sharing -- jussi runs it as
  #     redis-server --maxmemory ${JUSSI_REDIS_MAX_MEMORY:-8G} --maxmemory-policy allkeys-lru
  # and haf_fyp/api.py reasons explicitly about "a shared, noeviction Redis" when
  # it argues that unbounded rate-limit key minting is an OOM path. Under
  # allkeys-lru that argument inverts: nothing OOMs, and the limiter's buckets are
  # evicted under memory pressure instead -- rate limits quietly stop holding,
  # with no error anywhere. A limiter that fails open silently is worse than one
  # that fails loudly.
  #
  # WHAT THE POLICY BELOW IS AND IS NOT. It is redis' own default, and a
  # maxmemory-policy without a maxmemory ceiling never fires -- so it DECLARES the
  # requirement next to the service, it does not enforce it. It would also lose the
  # very merge it describes: the other file's `command` can win and this line be
  # dropped with no warning. The RENAME is the control here; this flag is the
  # statement of intent, and it starts mattering the day a deployment sets a
  # ceiling.
  #
  # The two generic names this left behind were settled by #48: `postgrest` is now
  # `haf-fyp-postgrest`, and `haf` keeps its name deliberately -- see the header.
  haf-fyp-redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  # These names need Compose v2.18.1 or newer: earlier releases reject a default inside a
  # default (`${A:-${B:-c}}`) with `invalid interpolation format`, and then every command
  # on this file fails. README's Prerequisites states it.
  #
  # Named through variables (#53). Unset, the names follow the project as unpinned ones
  # would: `haf_fyp_*`, or `<p>_*` under `-p <p>` / COMPOSE_PROJECT_NAME -- so a second
  # instance started with `-p` gets its own volumes, not the first stack's HAF datadir.
  # (Before Compose v2.27.1, `-p` combined with a DIFFERENT COMPOSE_PROJECT_NAME in the shell
  # or env file takes the volume names from COMPOSE_PROJECT_NAME.)
  #
  # Set, HAF_FYP_HAF_DATADIR_VOLUME=docker_haf_datadir in .env.local lets a stack started
  # before #53 under the default project, `docker`, keep its HAF database without copying it;
  # scripts/upgrade_standalone_stack.sh sets it. Compose warns that such a
  # volume `already exists but was created for project "docker"` and uses it (measured on
  # Compose v2.20.3, v2.24.7, v2.30.3, v2.39.4 and v5.1.4). The redis override exists for
  # symmetry; the upgrade does not need it, since redis holds nothing worth keeping.
  # tests/unit/test_compose_contract.py pins this wiring.
  haf_datadir:
    name: ${HAF_FYP_HAF_DATADIR_VOLUME:-${COMPOSE_PROJECT_NAME:-haf_fyp}_haf_datadir}
  redis_data:
    name: ${HAF_FYP_REDIS_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-haf_fyp}_redis_data}

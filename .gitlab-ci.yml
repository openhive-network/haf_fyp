stages:
  - lint
  - test
  - build

sql-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install sqlfluff==3.3.0 -q
    - sqlfluff lint db/ endpoints/ --dialect postgres
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

shell-lint:
  stage: lint
  image: koalaman/shellcheck-alpine:latest
  script:
    - find scripts/ -name "*.sh" -exec shellcheck --severity=warning {} +
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

python-lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install ruff -q
    - ruff check haf_fyp/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

python-tests:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt pytest -q
    - PYTHONPATH=. pytest tests/unit/ -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker-build-sql:
  extends: .docker-build
  script:
    - docker build -f Dockerfile.sql -t $CI_REGISTRY_IMAGE/sql:$CI_COMMIT_SHORT_SHA .

docker-build-python:
  extends: .docker-build
  script:
    - docker build -f Dockerfile.python -t $CI_REGISTRY_IMAGE/python:$CI_COMMIT_SHORT_SHA .

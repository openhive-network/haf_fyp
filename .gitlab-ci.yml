stages:
  - lint
  - test
  - build

.python-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/

sql-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install sqlfluff==3.3.0 -q
    - sqlfluff lint db/ endpoints/ --dialect postgres
    # scripts/ and docker/ added with #27's two new .sql files. shell-lint's scope was
    # widened for exactly this reason -- new files in a directory the linter did not
    # read -- and sql-lint's was not; both new files failed on their first run.
    #
    # Three LAYOUT rules excluded here and only here, because every .sql in these two
    # directories is fed to psql with -v and uses :'var' substitution, which sqlfluff
    # cannot parse: it reads the colon as an operator, so each placeholder becomes a
    # spacing or indent complaint. (scripts/set_version.sql has done this since #20.)
    # Excluding the layout rules keeps the parse check and every rule about meaning --
    # which is what would catch a broken predicate. db/ and endpoints/ stay strict.
    - sqlfluff lint scripts/ docker/ --dialect postgres --exclude-rules LT01,LT02,LT14
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

shell-lint:
  stage: lint
  # Pinned, for the reason python-lint pins ruff: this job's scope just doubled, and an
  # unpinned linter means a drifting build can fail unchanged code. :latest was 0.11.0
  # when this was widened.
  image: koalaman/shellcheck-alpine:v0.11.0
  script:
    # docker/ was never linted, so docker/rewriter_entrypoint.sh -- which has shipped in
    # the rewriter image since !49 -- had no coverage, and #27's new
    # docker/block-processing-healthcheck.sh and docker_entrypoint.sh, which run on
    # every container start, would have inherited that blind spot.
    #
    # It found nothing. Both files were already clean, and an earlier revision of this
    # MR edited rewriter_entrypoint.sh claiming SC2154 forced it -- SC2154 does not fire
    # on ALL-CAPS names, and that edit has been reverted. The scope widening is worth
    # keeping on its own terms; it is future coverage, not a fix.
    - find scripts/ docker/ -name "*.sh" -exec shellcheck --severity=warning {} +
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

python-lint:
  extends: .python-cache
  stage: lint
  image: python:3.11-slim
  script:
    # ruff is pinned: an unpinned `pip install ruff` is non-deterministic — a
    # drifting build silently widens the enforced ruleset and fails on unchanged
    # code that a prior pipeline passed (seen on !38, where a fresh ruff flagged
    # pre-existing UP045/BLE001/DTZ003 across files the MR never touched). Pin so
    # the lint result is reproducible; bump deliberately, cleaning findings in the
    # same commit.
    - pip install ruff==0.15.12 mypy types-redis -q
    - ruff check haf_fyp/
    - mypy haf_fyp/ --ignore-missing-imports
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

hadolint:
  stage: lint
  # Pinned for the same reason as shellcheck above.
  image: hadolint/hadolint:v2.12.0-alpine
  script:
    - hadolint Dockerfile.python Dockerfile.sql Dockerfile.rewriter
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

compose-validate:
  stage: lint
  image: docker:24
  variables:
    HAF_REGISTRY: "registry.example.com"
    HAF_VERSION: "latest"
    POSTGREST_VERSION: "latest"
    FYP_ADMIN_API_KEY: "dummy"
  script:
    - docker compose -f docker/docker-compose.yml config --quiet
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

openapi-drift:
  stage: lint
  image: python:3.12-slim
  variables:
    # Pinned, for the reason sql-lint pins sqlfluff and shell-lint pins shellcheck: an
    # unpinned tool means a drifting build can fail unchanged code. scripts/openapi_rewrite.sh
    # defaults to COMMON_CI_REF=develop, so without this the job would fetch a NEW generator
    # on every run and an upstream edit to process_openapi.py would turn this pipeline red
    # with no change in this repo. Same SHA hive/haf_stats pins; verified to reproduce the
    # committed endpoints/ byte-for-byte.
    #
    # The script's own default stays "develop" for local runs, so a developer regenerating
    # by hand can still produce output this job rejects. They agree today; if they diverge,
    # bump both together.
    COMMON_CI_REF: "96889a650b3f45244cecc4bb3f250af439a71900"
  script:
    # endpoints/endpoint_schema.sql's embedded spec and endpoints/rewrite_rules.conf are
    # GENERATED from the /** openapi:paths */ annotations, by a script a developer is
    # expected to remember to run ("Run this after adding or changing endpoint
    # annotations, then commit the result"). Nothing enforced it, so an annotation edit
    # without a regeneration -- or a hand-edit of either generated file -- shipped
    # silently, and the spec served at / could advertise a path the rewriter does not
    # route: a third party reads the spec, requests the path, gets a 404, and every job
    # in the pipeline is green. (#45)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl >/dev/null
    - bash scripts/openapi_rewrite.sh
    # Assert the pathspec below still resolves: see the note in that block.
    - git ls-files --error-unmatch endpoints/endpoint_schema.sql endpoints/rewrite_rules.conf >/dev/null
    - |
      # git status, not `git diff`: diff ignores UNTRACKED files. Today the generator can
      # only ever rewrite two already-tracked paths, so that arm is belt-and-braces rather
      # than load-bearing -- but it costs nothing and stops being theoretical the moment a
      # generated artefact is added. --porcelain is stable output by contract.
      #
      # The pathspec scopes this to endpoints/. Note a pathspec matching NOTHING also
      # yields empty output and a pass, so the ls-files check above asserts the two files
      # still exist under that path; without it, renaming endpoints/ would leave this job
      # reporting success forever. The script's leftovers (scripts/process_openapi.py,
      # scripts/openapi_out/, a repo-root rewrite_rules.conf) are outside the pathspec;
      # openapi_out/ and the root conf are removed by the script, process_openapi.py is
      # gitignored and deliberately kept.
      #
      # `git status --porcelain` exits 0 whether the tree is clean or dirty -- drift is
      # signalled by non-empty OUTPUT, never by the exit code. (`git diff --exit-code` is
      # the command with the 0/1/>=128 taxonomy; it is not used here because it ignores
      # untracked files.) So a non-zero status from THIS command is only ever a real git
      # failure -- dubious ownership, a GIT_STRATEGY override -- and reporting it as
      # "endpoints/ is not what the generator produces" would print an EMPTY diff and send
      # the author off to regenerate a file that was already correct.
      # `if ! changed=$(...)`, not a separate $? test: gitlab-runner emits `set -eo pipefail`
      # at the top of the job script, so a failing command substitution in a plain
      # assignment kills the shell before $? is ever read.
      if ! changed="$(git status --porcelain -- endpoints/)"; then
        echo "ERROR: git failed -- this is a runner problem, not drift."
        exit 1
      fi
      if [ -n "$changed" ]; then
        echo "ERROR: endpoints/ is not what scripts/openapi_rewrite.sh generates."
        echo "Run it locally and commit the result."
        echo "$changed"
        git --no-pager diff -- endpoints/
        exit 1
      fi
    - echo "endpoints/ matches the generator."
    # Generator fidelity is not the same as spec conformance, and this repo proved it: the
    # committed document reproduced its annotations exactly and this step still rejected
    # it. Five optional query parameters carried `default: null` against a scalar `type`.
    #
    # Be precise about what that violated, because it is not the meta-schema: OpenAPI 3.1
    # defers to JSON Schema 2020-12, where `default` is an ANNOTATION and is only
    # RECOMMENDED to validate against its own schema -- the official 3.1 meta-schema
    # accepts those five. It is openapi-spec-validator that enforces the stricter OpenAPI
    # 3.0 rule ("this value MUST conform to the defined type") against 3.1 documents. We
    # obey it rather than carry an exception, because the nullable union is what the
    # document should have said anyway, and is what endpoint_schema.sql already documents
    # as this repo's rule ("["string", "null"], not `nullable: true`").
    #
    # A diff check alone stays green on all of it. Validate what we actually serve.
    # Pinned for the same reason as the generator above: a validator release that adds or
    # tightens an OpenAPI 3.1 rule would fail this pipeline with no repo change.
    - pip install openapi-spec-validator==0.9.0 -q
    - |
      python - <<'PYEOF'
      import re, sys, json
      from openapi_spec_validator import OpenAPIV31SpecValidator
      src = open("endpoints/endpoint_schema.sql", encoding="utf-8").read()
      m = re.search(r"openapi json = \$\$(.*?)\$\$;", src, re.S)
      if not m:
          sys.exit("could not extract the embedded OpenAPI blob")
      errs = list(OpenAPIV31SpecValidator(json.loads(m.group(1))).iter_errors())
      for e in errs:
          # e.absolute_path is [] for a default-value failure -- the validator reports it
          # against the sub-schema, not the document -- so json_path alone names nothing
          # useful. Print the schema too, or the author gets five identical lines.
          print("INVALID:", e.json_path, list(e.absolute_schema_path), "-", e.message)
          print("         schema:", e.schema)
      sys.exit(1 if errs else 0)
      PYEOF
    - echo "served OpenAPI document is valid."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

python-tests:
  extends: .python-cache
  stage: test
  image: python:3.11-slim
  script:
    # httpx: required by starlette.testclient, which tests/unit/test_ratelimit_key.py
    # uses to assert rate-limit bucketing end-to-end through slowapi. Test-only, so
    # it stays out of requirements.txt and off the runtime image.
    # pyyaml: tests/unit/test_compose_contract.py parses docker-compose.yml. That
    # module FAILS rather than skips when it is missing under CI, for the same reason
    # the bash harness does -- a silent skip would put the compose file, and the
    # profile that keeps the destructive teardown from running on `up`, back to
    # uncovered.
    # git: tests/unit/test_openapi_drift_gate.py drives the openapi-drift job's real
    # drift check against throwaway repositories, so it needs a real git -- the whole
    # point is that the gate's pass/fail is exercised rather than paraphrased.
    # python:3.11-slim does not ship one. That module FAILS rather than skips when git
    # is missing under CI, for the same reason the bash harness does: a silent skip
    # would put the gate itself back to uncovered.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
    - pip install -r requirements.txt pytest pytest-cov httpx pyyaml -q
    - PYTHONPATH=. pytest tests/unit/ -v -rfEs --cov=haf_fyp --cov-report=term-missing --cov-fail-under=40
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

fastapi-tests:
  extends: .python-cache
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:14-alpine
      alias: haf
  variables:
    POSTGRES_DB: haf_block_log
    POSTGRES_USER: haf_fyp_user
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_HOST: haf
    POSTGRES_PORT: "5432"
    POSTGRES_PASSWORD: ""
    ADMIN_API_KEY: ""
    API_URL: "http://localhost:3000"
    FASTAPI_URL: "http://localhost:3002"
    # Makes the tavern lane key rate limits on each stage's X-Real-IP rather than on
    # the one loopback peer they all share. Since #28 the per-IP limit is charged
    # before the body is parsed, so this file's 422/401 cases spend the allowance
    # too, and the seven DELETE /v1/fyp/interests stages would blow that endpoint's
    # 5/minute and start returning 429. A peer absent from this list has its header
    # ignored -- correctly, and silently, which presents as the limits simply not
    # working, so the value has to be right rather than approximately right.
    # ::1 is belt-and-braces only: `uvicorn --host 0.0.0.0` binds AF_INET, so a v6
    # loopback peer cannot actually reach it. Harmless, and survives someone
    # switching the bind to `::`.
    TRUSTED_PROXY_IPS: "127.0.0.1,::1"
  script:
    - pip install -r requirements.txt pytest -q
    - sleep 5
    - |
      python3 -c "
      import psycopg2, os
      c = psycopg2.connect(host=os.environ['POSTGRES_HOST'], port=os.environ['POSTGRES_PORT'],
                           dbname=os.environ['POSTGRES_DB'], user=os.environ['POSTGRES_USER'],
                           password=os.environ.get('POSTGRES_PASSWORD',''))
      c.autocommit = True
      c.cursor().execute(open('tests/haf_stub.sql').read())
      c.cursor().execute(open('tests/ci_fastapi_setup.sql').read())
      # #16: the real SECURITY DEFINER reader GET /sync-status calls. Loaded from
      # db/ (not restubbed) so the tavern check exercises the shipped function body.
      c.cursor().execute(open('db/sync_status.sql').read())
      c.close()
      print('DB setup complete')
      "
    # pg-backed tests that load their own functions: feed-events rollup/retention
    # (#12) and embedding-coverage refresh (#15).
    - PYTHONPATH=. pytest tests/integration/ -v
    - PYTHONPATH=. uvicorn haf_fyp.api:app --host 0.0.0.0 --port 3002 &
    - sleep 3
    - echo 'variables:' > /tmp/tavern_cfg.yaml
    - 'echo "  fastapi_url: $FASTAPI_URL" >> /tmp/tavern_cfg.yaml'
    - 'echo "  api_url: $API_URL" >> /tmp/tavern_cfg.yaml'
    - PYTHONPATH=. pytest tests/tavern/test_fastapi_endpoints.tavern.yaml --tavern-global-cfg=/tmp/tavern_cfg.yaml -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

postgrest-tests:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # --build is load-bearing for LOCAL runs of this file: compose only builds when the
    # derived image is absent, so after the first run an edit to
    # endpoints/rewrite_rules.conf or Dockerfile.rewriter would be silently ignored and
    # the suite would go green on the OLD rules -- exactly the failure the rewriter
    # stages exist to catch (#44). In CI's ephemeral dind nothing is cached, so it
    # changes nothing there.
    - docker compose -f docker/docker-compose-ci.yml up --detach --build
    - docker compose -f docker/docker-compose-ci.yml wait tavern
  after_script:
    - docker compose -f docker/docker-compose-ci.yml logs setup
    - docker compose -f docker/docker-compose-ci.yml logs tavern
    # Turns "some path 404'd" into "that rule rewrote to X". `|| true` because
    # after_script runs under set -e: if the build failed the service has no
    # container, and a non-zero here would skip the `down -v` below.
    - docker compose -f docker/docker-compose-ci.yml logs haf-fyp-postgrest-rewriter || true
    - docker compose -f docker/docker-compose-ci.yml down -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.docker-build:
  stage: build
  image: docker:24
  # Three jobs each push their own moving tag. Without a resource group two
  # overlapping default-branch pipelines race per-image and can leave the three
  # tags on DIFFERENT commits, which nothing detects. interruptible lets GitLab's
  # auto-cancel actually fire -- it only cancels pipelines whose jobs are all
  # interruptible, and the default is false, so today both run to completion.
  resource_group: registry-$CI_COMMIT_REF_SLUG
  interruptible: true
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Push only from the default branch. Merge-request pipelines still BUILD -- that is
# what catches a broken Dockerfile before review -- but publishing every MR commit
# would fill the registry with images nobody consumes and make the tag list useless
# for finding a deployable build.
#
# Two tags on a push:
#   :<short-sha>  immutable, what a deployment pins
#   :<default-branch>  moving, what a downstream tracks. Named from
#                     $CI_DEFAULT_BRANCH, slashes replaced -- docker tags cannot
#                     contain "/", so a default branch like release/1.0 would
#                     otherwise be an invalid reference and hard-fail the push.
# haf_fyp has no releases, so the branch tag is the honest stand-in for the
# ${..._VERSION} tag haf_api_node's compose files expect. Siblings differ here:
# haf_stats is short-sha only (137/137), while balance_tracker and
# reputation_tracker are mostly semver (50/132 and 5/71 sha) -- which is exactly
# why ${APP_VERSION:-${HIVE_API_NODE_VERSION}} has nothing to resolve to for us.
# Add a semver tag when releases start rather than pinning raw SHAs forever (#26).
# A scalar, not a list: `- *anchor` then splices ONE string. Aliasing a list here
# would nest an array inside script:, which GitLab flattens but which reads as a
# mistake to anyone who does not know that.
.push-if-default-branch: &push_if_default_branch |
  if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
    BRANCH_TAG=$(echo "$CI_DEFAULT_BRANCH" | tr '/' '-')
    docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    docker tag  "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$BRANCH_TAG"
    docker push "$IMAGE:$BRANCH_TAG"
    echo "pushed $IMAGE:$CI_COMMIT_SHORT_SHA and :$BRANCH_TAG"
  else
    echo "not on $CI_DEFAULT_BRANCH - built only, not pushed"
  fi

docker-build-sql:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/sql
  script:
    # GIT_HASH -> ENV -> written to haf_fyp_app.app_version by install_app.sh step 15,
    # so GET /version names the commit the image was built from (#20). Short SHA to
    # match the tag.
    - docker build -f Dockerfile.sql
        --build-arg GIT_HASH="$CI_COMMIT_SHORT_SHA"
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
        --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
        --build-arg BUILD_TIME="$CI_JOB_STARTED_AT"
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Smoke-run the image (#27). Until this existed, NOTHING in CI ever started a
    # container from Dockerfile.sql -- compose-validate only parses YAML, the postgrest
    # lane builds from docker-compose-ci.yml, and the unit tests run the scripts on the
    # Debian runner. So a script that works on Debian and dies on the image's Alpine
    # userland passed every job. That is not hypothetical: an earlier revision of this
    # MR shipped `date --utc --iso-8601=seconds`, a GNU long option BusyBox does not
    # have, in the first line of process_blocks.sh -- which under `set -e` would have
    # crash-looped haf-fyp-sync on every deployment, forever.
    #
    # These run without a database on purpose, so they are fast and cannot flake: each
    # exercises a path that resolves before the first connection. Note what that rules
    # OUT -- `uninstall_app` with no --force calls wait_for_postgres BEFORE its no-TTY
    # refusal, so smoke-testing that path here would hang in an unbounded
    # `until pg_isready` loop rather than fail. It is covered by a unit test instead.
    #
    # NOTE: do NOT reach for `! cmd` to assert a failure here. Bash exempts a
    # !-inverted pipeline from errexit, so `! grep -q X file` passes whatever the file
    # contains -- that is the bug fixed below. Capture the status instead, which is what
    # expect_fail does.
    - |
      set -e
      IMG="$IMAGE:$CI_COMMIT_SHORT_SHA"
      # `run` wrapper: every assertion greps for a message. A bare `! docker run ...`
      # passes on ANY non-zero status, including 127 when the file is not in the image
      # -- so it would have "verified" a healthcheck that had never been COPYed. And
      # `timeout` because a job that hangs reports "job timeout" rather than a diff.
      expect_ok()   { timeout 60 docker run --rm "$IMG" "$@"; }
      # 124 is timeout's own kill, 125/126 are docker/exec failures, 127 is
      # "not found" -- none of them is the script rejecting its input. Excluding
      # them is the rule round two arrived at the hard way: an assertion whose
      # expected outcome is a non-zero exit must name a SPECIFIC reachable exit.
      expect_fail() { rc=0; timeout 60 docker run --rm "$IMG" "$@" >/tmp/o 2>&1 || rc=$?; cat /tmp/o; case "$rc" in 0|124|125|126|127) return 1 ;; *) return 0 ;; esac; }

      echo "--- entrypoint dispatches its own usage on stdout ---"
      expect_ok --help | grep -q "install_app"
      echo "--- unknown verb fails with the right message, not merely non-zero ---"
      expect_fail install-app; grep -q "unknown verb: install-app" /tmp/o
      echo "--- the scripts parse and render help under the image's BusyBox userland ---"
      expect_ok install_app   --help | grep -q -- "--swagger-url"
      expect_ok uninstall_app --help | grep -q -- "--force"
      expect_ok process_blocks --help | grep -q -- "--host"
      echo "--- an invalid option is rejected, not ignored ---"
      expect_fail install_app --nope; grep -q "is not a valid option" /tmp/o
      echo "--- the no-op module-file flags are accepted, not rejected ---"
      # --help AFTER them on purpose: the option loop processes every argument, so this
      # proves acceptance and then exits 0 WITHOUT reaching wait_for_postgres. Asserting
      # these with expect_fail instead hung the sibling app's docker-build for 58
      # minutes -- with nothing to exit at, the script fell into an unbounded
      # `until pg_isready` and `timeout` could not reap it through the container.
      for verb in install_app uninstall_app process_blocks; do
        expect_ok "$verb" --schema=btracker_app --is_forking=TRUE --help >/tmp/f 2>&1
        cat /tmp/f
        grep -q "WARNING: --schema" /tmp/f || { echo "FAIL: $verb did not warn on a foreign --schema"; exit 1; }
        grep -q "btracker_app" /tmp/f || { echo "FAIL: $verb did not name the ignored value"; exit 1; }
      done
      echo "--- but a connection URI is REFUSED, not half-honoured ---"
      # Honouring it moved only the psql connection: the messages and the teardown's
      # confirmation prompt still read POSTGRES_HOST/POSTGRES_DB, so it could act on one
      # database while reporting another. Refusing is safe -- --postgres-url appears in
      # one upstream module file, on a service with no restart policy.
      for verb in install_app uninstall_app process_blocks; do
        expect_fail "$verb" --postgres-url=postgresql://haf_admin@haf/haf_block_log
        grep -q "not supported yet" /tmp/o || { echo "FAIL: $verb did not refuse --postgres-url clearly"; exit 1; }
        grep -q -- "--host=" /tmp/o || { echo "FAIL: $verb did not name the alternative flags"; exit 1; }
      done
      echo "--- the compat path the LIVE node uses still dispatches ---"
      expect_ok /app/scripts/install_app.sh --help | grep -q -- "--swagger-url"
      echo "--- the healthcheck is present at the path module files hardcode ---"
      expect_ok test -r /app/block-processing-healthcheck.sql
      timeout 60 docker run --rm --entrypoint /app/block-processing-healthcheck.sh "$IMG" >/tmp/h 2>&1 && exit 1
      cat /tmp/h; grep -q "hasn.t started yet" /tmp/h
      echo "--- and fails CLOSED when it has a startup time but no database ---"
      # Greps, like every other assertion. Without it this passed on ANY non-zero --
      # including 124 (a 60s hang), 127, or the script exiting 1 because the .sql was
      # missing, which is precisely the case the assertion above it is meant to prove.
      timeout 60 docker run --rm -e HAF_FYP_STARTUP_TIME_FILE=/etc/hostname         --entrypoint /app/block-processing-healthcheck.sh "$IMG" >/tmp/h2 2>&1 && exit 1
      cat /tmp/h2
      # `psql: error:` is psql's own prefix for any connection failure, so this does not
      # depend on guessing the wording -- the first attempt matched four phrasings and
      # the image emitted a fifth ("could not translate host name"). Pairing it with the
      # negative assertion is what makes it precise: it proves the script reached psql
      # and psql failed, rather than the script exiting 1 down the missing-SQL-file path
      # that the assertion above it exists to rule out.
      grep -q "psql: error:" /tmp/h2
      # NOT `! grep -q ...`: bash exempts a !-inverted pipeline from errexit, so that
      # form passes whatever the file contains -- and it is the only thing separating
      # "failed closed for the right reason" from "failed because the SQL was never
      # COPYed into the image".
      if grep -q "healthcheck SQL not found" /tmp/h2; then
        echo "FAIL: healthcheck could not find its .sql -- COPY missing from Dockerfile"
        exit 1
      fi
      echo "image smoke tests passed"
    - *push_if_default_branch

docker-build-python:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/python
  script:
    - docker build -f Dockerfile.python
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
        --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
        --build-arg BUILD_TIME="$CI_JOB_STARTED_AT"
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - *push_if_default_branch

# The URL rewriter that fronts PostgREST, serving the clean /v1/fyp/... paths instead
# of raw /rpc/<function>. Dockerfile.rewriter and its inputs have existed all along but
# nothing ever built them, so deployments borrowed balance_tracker's rewriter image and
# bind-mounted endpoints/rewrite_rules.conf from the host. That is why a path change
# (e.g. #21's /v1/fyp/metrics -> /v1/fyp/feed-metrics) needed a node-side file edit
# rather than an image bump, and why host and repo could silently diverge.
docker-build-rewriter:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/postgrest-rewriter
  script:
    - docker build -f Dockerfile.rewriter
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
        --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
        --build-arg GIT_LAST_LOG_MESSAGE="$CI_COMMIT_TITLE"
        --build-arg BUILD_TIME="$CI_JOB_STARTED_AT"
        --build-arg GIT_LAST_COMMITTER="$CI_COMMIT_AUTHOR"
        --build-arg GIT_LAST_COMMIT_DATE="$CI_COMMIT_TIMESTAMP"
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - *push_if_default_branch

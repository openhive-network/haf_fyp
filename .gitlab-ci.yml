stages:
  - lint
  - test
  - build
  - release
  - publish

.python-cache:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/

# The rules every lane below carries, as one definition rather than ten copies -- because
# they now have to say something they did not before.
#
# A SCHEDULED pipeline runs on a branch, so it sets CI_COMMIT_BRANCH, and a schedule on
# develop makes `$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH` TRUE. Without the first rule,
# creating the schedule this MR adds would run the ENTIRE pipeline every time -- every lint,
# every test, and all three docker-build jobs, which push `:<short-sha>` and `:develop`. That
# would republish images from unchanged source and move the very digests registry-resolution
# exists to watch, on a timer, for nothing. `when: never` first, because the first matching
# rule decides.
#
# The same goes for the ON-DEMAND sweep. "Run pipeline" with RUN_REGISTRY_RESOLUTION=true
# creates a `web` pipeline, and on develop that sets CI_COMMIT_BRANCH too -- so without the
# second rule, asking for the registry check would rerun every lane and republish :develop.
.standard-rules: &standard_rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $RUN_REGISTRY_RESOLUTION == "true"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

sql-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install sqlfluff==3.3.0 -q
    - sqlfluff lint db/ endpoints/ --dialect postgres
    # scripts/ and docker/ added with #27's two new .sql files. shell-lint's scope was
    # widened for exactly this reason -- new files in a directory the linter did not
    # read -- and sql-lint's was not; both new files failed on their first run.
    #
    # Three LAYOUT rules excluded here and only here, because every .sql in these two
    # directories is fed to psql with -v and uses :'var' substitution, which sqlfluff
    # cannot parse: it reads the colon as an operator, so each placeholder becomes a
    # spacing or indent complaint. (scripts/set_version.sql has done this since #20.)
    # Excluding the layout rules keeps the parse check and every rule about meaning --
    # which is what would catch a broken predicate. db/ and endpoints/ stay strict.
    - sqlfluff lint scripts/ docker/ --dialect postgres --exclude-rules LT01,LT02,LT14
  rules: *standard_rules

shell-lint:
  stage: lint
  # Pinned, for the reason python-lint pins ruff: this job's scope just doubled, and an
  # unpinned linter means a drifting build can fail unchanged code. :latest was 0.11.0
  # when this was widened.
  image: koalaman/shellcheck-alpine:v0.11.0
  script:
    # docker/ was never linted, so docker/rewriter_entrypoint.sh -- which has shipped in
    # the rewriter image since !49 -- had no coverage, and #27's new
    # docker/block-processing-healthcheck.sh and docker_entrypoint.sh, which run on
    # every container start, would have inherited that blind spot.
    #
    # It found nothing. Both files were already clean, and an earlier revision of this
    # MR edited rewriter_entrypoint.sh claiming SC2154 forced it -- SC2154 does not fire
    # on ALL-CAPS names, and that edit has been reverted. The scope widening is worth
    # keeping on its own terms; it is future coverage, not a fix.
    - find scripts/ docker/ -name "*.sh" -exec shellcheck --severity=warning {} +
  rules: *standard_rules

python-lint:
  extends: .python-cache
  stage: lint
  image: python:3.11-slim
  script:
    # ruff is pinned: an unpinned `pip install ruff` is non-deterministic — a
    # drifting build silently widens the enforced ruleset and fails on unchanged
    # code that a prior pipeline passed (seen on !38, where a fresh ruff flagged
    # pre-existing UP045/BLE001/DTZ003 across files the MR never touched). Pin so
    # the lint result is reproducible; bump deliberately, cleaning findings in the
    # same commit.
    # mypy and types-redis are pinned for the same reason, and so are mypy's own runtime
    # dependencies: ast-serialize and librt are compiled parts of mypy 2.x that move on
    # their own (ast-serialize 0.13.0 -> 0.13.1 on 2026-10-17), so pinning mypy alone
    # would not hold its behaviour still. These are the versions pip resolved for this
    # job on python:3.11-slim on 2026-10-21. Left floating: cryptography/cffi/pycparser
    # and types-cffi/types-setuptools, which types-redis drags in and our code never
    # touches.
    #
    # What this mypy step checks: requirements.txt is NOT installed, so with
    # --ignore-missing-imports every third-party import except redis (fastapi,
    # starlette, pydantic, slowapi, limits, anyio, psycopg2, pandas, numpy, pgvector,
    # coincurve, base58) is Any and unchecked. It is a self-consistency pass over
    # our own annotations, not type coverage of the framework code. The redis types come
    # from types-redis 4.6, which predates requirements.txt's redis>=5.0; the redis it
    # resolves today (8.x) ships its own py.typed, so once requirements.txt is installed
    # here types-redis must be dropped. Sizing and remaining steps: #42.
    - >-
      pip install -q ruff==0.15.12
      mypy==2.4.0 ast-serialize==0.13.1 librt==0.16.0 pathspec==1.1.1
      typing_extensions==4.16.0 mypy_extensions==1.1.0
      types-redis==4.6.0.20241004 types-pyOpenSSL==24.1.0.20240722
    - ruff check haf_fyp/
    - mypy haf_fyp/ --ignore-missing-imports
  rules: *standard_rules

hadolint:
  stage: lint
  # Pinned for the same reason as shellcheck above.
  image: hadolint/hadolint:v2.12.0-alpine
  script:
    - hadolint Dockerfile.python Dockerfile.sql Dockerfile.rewriter
  rules: *standard_rules

compose-validate:
  stage: lint
  image: docker:24
  variables:
    # Placeholders, not a pin: this job runs `config`, which parses YAML and never
    # contacts a registry, and the compose file interpolates every ${VAR} it names. They
    # are deliberately NOT the values docker/.env ships -- a lane that cannot pull cannot
    # tell a good reference from a dead one, which is how #56 stayed green here. The pin
    # itself is checked offline by tests/unit/test_compose_contract.py, and whether it still
    # RESOLVES by the scheduled registry-resolution job below (#71). The three are
    # complements, not duplicates: syntax here, shape and release floor there, existence
    # against the real registry on a timer.
    HAF_REGISTRY: "registry.example.com"
    HAF_VERSION: "latest"
    POSTGREST_VERSION: "latest"
    FYP_ADMIN_API_KEY: "dummy"
  script:
    - docker compose -f docker/docker-compose.yml config --quiet
    # Needs none of the placeholders above: it builds its one image from this checkout.
    - docker compose -f docker/docker-compose-ci-install.yml config --quiet
    # Takes HAF_REGISTRY from above and HAF_INSTALL_LANE_VERSION from docker/.env.
    - docker compose -f docker/docker-compose-ci-install-haf.yml config --quiet
  rules: *standard_rules

# Does what compose-validate CANNOT, and the two are complements, not duplicates.
# compose-validate parses YAML with placeholder values and never contacts a registry; this
# resolves the values docker/.env actually ships, against the real registries. #56 was green
# in the first and would have been red here on the day it was written.
#
# SCHEDULED, not per-MR. The question -- "does this tag still exist?" -- has an answer that
# changes without anyone touching this repository, so an MR is the wrong moment to ask it and
# the wrong thing to block on a registry being reachable. Set the schedule up in
# Build > Pipeline schedules on the default branch. Nothing else in this file runs in a
# scheduled pipeline: every other lane carries .standard-rules, and publish_tag -- which is
# not a branch lane and so does not -- carries the same exclusion of its own, because a
# schedule may target a TAG.
#
# NO dind service and NO docker login. The references are resolved with manifest HEADs over
# the registries' HTTP API (curl), and `docker compose config` -- which extracts them -- is
# client-side; neither needs a daemon. These are public repositories, and anonymous is how an
# operator pulls them: authenticating would mask a repository that has become unreadable to
# everyone without our credentials.
#
# NO allow_failure, in any form (#71). The first attempt (!77) excused its "inconclusive" exit
# code, and Docker Hub answers a rate-limited GET and a dead tag with the same 429 -- so it
# excused dead pins, reporting success with 3 of 10 images verified. The script now uses HEAD
# requests, which Hub does not count against that limit, and passes only when EVERY reference
# was positively resolved. A registry that will not answer turns the pipeline red on a timer:
# that is the intended cost, because a check that cannot fail is what #56 already had.
registry-resolution:
  stage: lint
  image: docker:24
  # NOT interruptible. This project has auto-cancel-redundant-pipelines on, so a push to the
  # default branch shortly after the cron tick would otherwise cancel the sweep: no answer, no
  # red, nothing. (A job still waiting for a runner counts as interruptible whatever it says,
  # so that narrow window remains; once it runs, it finishes.) It and haf-shim-drift-develop
  # are the only jobs in a scheduled pipeline, and neither runs in a push or MR pipeline, so
  # holding it costs nothing elsewhere -- the same reasoning as publish_tag.
  interruptible: false
  # ABOVE the script's own budget, which the lane test holds it to: HAF_FYP_RESOLVE_DEADLINE
  # (420s) plus one in-flight attempt (HEAD + token + HEAD at 20s each) plus the image pull and
  # the tool install below: three attempts, each capped by apk's per-fetch timeout, and 45s of
  # backoff between them. The script then reports what it proved and what it did not before the job is
  # killed -- rather than the hung-registry case arriving as a bare "job timed out", which is
  # how !77's 32-minute worst case met its 10-minute limit. Without a timeout the ceiling is
  # the project default, an hour, holding a shared runner unattended.
  timeout: 13m
  # Infrastructure only, and the same single reason publish_tag uses. The script retries each
  # request itself, and re-running the whole job on a real failure would print the same dead
  # pin three times.
  retry:
    max: 2
    when: runner_system_failure
  before_script:
    # Retried: the first real run of this job (on-demand pipeline 180731) died right here --
    # fetching from dl-cdn.alpinelinux.org failed with "temporary error" after 5s, most likely
    # a network blip on the runner -- a red job that said nothing about the pins. Three tries,
    # 15s then 30s apart, each capped by `--timeout 15` so a hung (not refused) mirror cannot
    # eat the job's budget at apk's default 60s per fetch; a mirror down for longer is still a
    # red job, with apk's own error. Nothing else may go in this block: it shares the script's
    # shell.
    - apk --timeout 15 add --no-cache curl jq || { sleep 15; apk --timeout 15 add --no-cache curl jq; } || { sleep 30; apk --timeout 15 add --no-cache curl jq; }
  script:
    - sh scripts/check_pinned_images.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # An on-demand hatch, because otherwise this job's FIRST EVER run would be a cron tick on
    # develop after merge: "Run pipeline" creates a `web` pipeline, not a `schedule` one, so
    # without this there is no way to exercise it -- and the debug loop for a lane that fails
    # in a way only the real registry shows would be edit, merge, wait a day.
    - if: $RUN_REGISTRY_RESOLUTION == "true"
    - when: never

openapi-drift:
  stage: lint
  image: python:3.12-slim
  variables:
    # Pinned, for the reason sql-lint pins sqlfluff and shell-lint pins shellcheck: an
    # unpinned tool means a drifting build can fail unchanged code. scripts/openapi_rewrite.sh
    # defaults to COMMON_CI_REF=develop, so without this the job would fetch a NEW generator
    # on every run and an upstream edit to process_openapi.py would turn this pipeline red
    # with no change in this repo. Same SHA hive/haf_stats pins; verified to reproduce the
    # committed endpoints/ byte-for-byte.
    #
    # The script's own default stays "develop" for local runs, so a developer regenerating
    # by hand can still produce output this job rejects. They agree today; if they diverge,
    # bump both together.
    COMMON_CI_REF: "96889a650b3f45244cecc4bb3f250af439a71900"
  script:
    # endpoints/endpoint_schema.sql's embedded spec and endpoints/rewrite_rules.conf are
    # GENERATED from the /** openapi:paths */ annotations, by a script a developer is
    # expected to remember to run ("Run this after adding or changing endpoint
    # annotations, then commit the result"). Nothing enforced it, so an annotation edit
    # without a regeneration -- or a hand-edit of either generated file -- shipped
    # silently, and the spec served at / could advertise a path the rewriter does not
    # route: a third party reads the spec, requests the path, gets a 404, and every job
    # in the pipeline is green. (#45)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl >/dev/null
    - bash scripts/openapi_rewrite.sh
    # Assert the pathspec below still resolves: see the note in that block.
    - git ls-files --error-unmatch endpoints/endpoint_schema.sql endpoints/rewrite_rules.conf >/dev/null
    - |
      # git status, not `git diff`: diff ignores UNTRACKED files. Today the generator can
      # only ever rewrite two already-tracked paths, so that arm is belt-and-braces rather
      # than load-bearing -- but it costs nothing and stops being theoretical the moment a
      # generated artefact is added. --porcelain is stable output by contract.
      #
      # The pathspec scopes this to endpoints/. Note a pathspec matching NOTHING also
      # yields empty output and a pass, so the ls-files check above asserts the two files
      # still exist under that path; without it, renaming endpoints/ would leave this job
      # reporting success forever. The script's leftovers (scripts/process_openapi.py,
      # scripts/openapi_out/, a repo-root rewrite_rules.conf) are outside the pathspec;
      # openapi_out/ and the root conf are removed by the script, process_openapi.py is
      # gitignored and deliberately kept.
      #
      # `git status --porcelain` exits 0 whether the tree is clean or dirty -- drift is
      # signalled by non-empty OUTPUT, never by the exit code. (`git diff --exit-code` is
      # the command with the 0/1/>=128 taxonomy; it is not used here because it ignores
      # untracked files.) So a non-zero status from THIS command is only ever a real git
      # failure -- dubious ownership, a GIT_STRATEGY override -- and reporting it as
      # "endpoints/ is not what the generator produces" would print an EMPTY diff and send
      # the author off to regenerate a file that was already correct.
      # `if ! changed=$(...)`, not a separate $? test: gitlab-runner emits `set -eo pipefail`
      # at the top of the job script, so a failing command substitution in a plain
      # assignment kills the shell before $? is ever read.
      if ! changed="$(git status --porcelain -- endpoints/)"; then
        echo "ERROR: git failed -- this is a runner problem, not drift."
        exit 1
      fi
      if [ -n "$changed" ]; then
        echo "ERROR: endpoints/ is not what scripts/openapi_rewrite.sh generates."
        echo "Run it locally and commit the result."
        echo "$changed"
        git --no-pager diff -- endpoints/
        exit 1
      fi
    - echo "endpoints/ matches the generator."
    # Generator fidelity is not the same as spec conformance, and this repo proved it: the
    # committed document reproduced its annotations exactly and this step still rejected
    # it. Five optional query parameters carried `default: null` against a scalar `type`.
    #
    # Be precise about what that violated, because it is not the meta-schema: OpenAPI 3.1
    # defers to JSON Schema 2020-12, where `default` is an ANNOTATION and is only
    # RECOMMENDED to validate against its own schema -- the official 3.1 meta-schema
    # accepts those five. It is openapi-spec-validator that enforces the stricter OpenAPI
    # 3.0 rule ("this value MUST conform to the defined type") against 3.1 documents. We
    # obey it rather than carry an exception, because the nullable union is what the
    # document should have said anyway, and is what endpoint_schema.sql already documents
    # as this repo's rule ("["string", "null"], not `nullable: true`").
    #
    # A diff check alone stays green on all of it. Validate what we actually serve.
    # Pinned for the same reason as the generator above: a validator release that adds or
    # tightens an OpenAPI 3.1 rule would fail this pipeline with no repo change.
    - pip install openapi-spec-validator==0.9.0 -q
    - |
      python - <<'PYEOF'
      import re, sys, json
      from openapi_spec_validator import OpenAPIV31SpecValidator
      src = open("endpoints/endpoint_schema.sql", encoding="utf-8").read()
      m = re.search(r"openapi json = \$\$(.*?)\$\$;", src, re.S)
      if not m:
          sys.exit("could not extract the embedded OpenAPI blob")
      errs = list(OpenAPIV31SpecValidator(json.loads(m.group(1))).iter_errors())
      for e in errs:
          # e.absolute_path is [] for a default-value failure -- the validator reports it
          # against the sub-schema, not the document -- so json_path alone names nothing
          # useful. Print the schema too, or the author gets five identical lines.
          print("INVALID:", e.json_path, list(e.absolute_schema_path), "-", e.message)
          print("         schema:", e.schema)
      sys.exit(1 if errs else 0)
      PYEOF
    - echo "served OpenAPI document is valid."
  rules: *standard_rules

# tests/unit/test_haf_canonical_names.py forbids the hive.* names that exist only in HAF's
# compatibility shim, from a hand-transcribed list. Nothing noticed upstream changing that
# list, so a fifth alias, a rename or a deleted shim left that test green forever (#52).
#
# Detection is a content fingerprint: tests/unit/data/haf_shim_ledger.json records
# haf_shim_ref (the pinned hive/haf commit the ledger was read from) and shim_sha256 (the
# sha256 of the shim there), and the script fails on ANY byte change -- no SQL parsing
# decides the verdict, so there is no construct it can miss. On drift it prints the hive.*
# names the new file appears to create against the ledger, as a reading aid. The guard and
# the script read that one file through the same loader, so they cannot disagree. To bump:
# re-read the file, refresh the vendored copy in tests/unit/data/, and update the ledger's
# symbols, haf_shim_ref and shim_sha256 together (steps in the guard's comments).
#
#   haf-shim-drift          MR + default-branch pipelines, the PINNED ref. A fixed commit
#                           cannot change upstream, so this fails only through our own
#                           bump or the network. Offline, python-tests (blocking) checks the
#                           vendored copy's name carries haf_shim_ref and its sha256 is
#                           shim_sha256 -- which catches a mistyped hash or an unrenamed
#                           copy, but NOT a copy renamed to a new ref with its old bytes:
#                           that still agrees with an unchanged hash, and only this job's
#                           fetch shows the bytes are not upstream's. So drift here (exit 1,
#                           which includes a pinned SHA that 404s) is our own bad bump and
#                           blocks; allow_failure only for exit 2, the script's "could not
#                           run", because a network blip must not block an MR.
#   haf-shim-drift-develop  the daily schedule (and the on-demand sweep): hive/haf develop
#                           against the same hash. This is where upstream drift appears.
#                           NOT allow_failure: it runs only where it blocks nothing, and an
#                           orange job in a scheduled pipeline notifies nobody -- the blind
#                           spot #52 exists to close.
#
# Exit 1 is drift (including a pinned SHA that 404s), exit 2 is a check that could not run
# (unreachable host, a --ref that 404s, a moved file, a broken ledger); neither is ever green. The fetch runs inside the script in the job's
# main shell, not in a $(...) substitution, so its exit code is what the runner sees.
haf-shim-drift:
  stage: lint
  image: python:3.11-slim
  allow_failure:
    exit_codes: [2]
  # One fetch with a 30s timeout; without this a hung job would hold a runner for the
  # project default, an hour. A job timeout is not exit 2, so it fails red.
  timeout: 5m
  script:
    - python scripts/check_haf_shim_drift.py --pinned
  rules: *standard_rules

haf-shim-drift-develop:
  stage: lint
  image: python:3.11-slim
  # NOT interruptible, as registry-resolution: auto-cancel-redundant-pipelines would otherwise
  # let a push to develop just after the cron tick cancel the check -- no answer, no red.
  interruptible: false
  timeout: 10m
  # Infrastructure only, as registry-resolution: re-running on a real failure would report
  # the same drift three times.
  retry:
    max: 2
    when: runner_system_failure
  script:
    - python scripts/check_haf_shim_drift.py --ref develop
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # The scheduled sweep's on-demand hatch, shared with registry-resolution, so the job can
    # be exercised without waiting for the cron tick.
    - if: $RUN_REGISTRY_RESOLUTION == "true"
    - when: never

python-tests:
  extends: .python-cache
  stage: test
  image: python:3.11-slim
  script:
    # httpx: required by starlette.testclient, which tests/unit/test_ratelimit_key.py
    # uses to assert rate-limit bucketing end-to-end through slowapi. Test-only, so
    # it stays out of requirements.txt and off the runtime image.
    # pyyaml: tests/unit/test_compose_contract.py parses docker-compose.yml. That
    # module FAILS rather than skips when it is missing under CI, for the same reason
    # the bash harness does -- a silent skip would put the compose file, and the
    # profile that keeps the destructive teardown from running on `up`, back to
    # uncovered.
    # git: tests/unit/test_openapi_drift_gate.py drives the openapi-drift job's real
    # drift check against throwaway repositories, so it needs a real git -- the whole
    # point is that the gate's pass/fail is exercised rather than paraphrased.
    # python:3.11-slim does not ship one. That module FAILS rather than skips when git
    # is missing under CI, for the same reason the bash harness does: a silent skip
    # would put the gate itself back to uncovered.
    # curl and jq: tests/unit/test_check_pinned_images.py runs the registry check against a
    # local fake registry, with the same tools the registry-resolution job installs.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl jq >/dev/null
    - pip install -r requirements.txt pytest pytest-cov httpx pyyaml -q
    - PYTHONPATH=. pytest tests/unit/ -v -rfEs --cov=haf_fyp --cov-report=term-missing --cov-fail-under=40
  rules: *standard_rules

fastapi-tests:
  extends: .python-cache
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:14-alpine
      alias: haf
  variables:
    POSTGRES_DB: haf_block_log
    POSTGRES_USER: haf_fyp_user
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_HOST: haf
    POSTGRES_PORT: "5432"
    POSTGRES_PASSWORD: ""
    # NOT empty (#50). With an empty key `activate_algorithm` answers 403 from
    # `not admin_key` and never reaches hmac.compare_digest, so nothing in THIS lane
    # ran the comparison and an inverted conditional passed it. The tavern stages for
    # the admin endpoint send this key, and the wrong ones below, through it.
    ADMIN_API_KEY: "ci-admin-key-0123456789-A"
    # Four keys that are almost right, each wrong in the one way a careless
    # comparison forgives: the last byte in the other case (same length, same
    # prefix, equal if case is ignored), the first byte in the other case (same
    # suffix), the key cut short by a byte (a prefix of it), and one letter in the
    # middle changed (same length, same first and last bytes).
    WRONG_ADMIN_API_KEY_LAST_BYTE: "ci-admin-key-0123456789-a"
    WRONG_ADMIN_API_KEY_FIRST_BYTE: "Ci-admin-key-0123456789-A"
    WRONG_ADMIN_API_KEY_CUT_SHORT: "ci-admin-key-0123456789-"
    WRONG_ADMIN_API_KEY_MIDDLE_BYTE: "ci-admin-kay-0123456789-A"
    API_URL: "http://localhost:3000"
    FASTAPI_URL: "http://localhost:3002"
    # Makes the tavern lane key rate limits on each stage's X-Real-IP rather than on
    # the one loopback peer they all share. Since #28 the per-IP limit is charged
    # before the body is parsed, so this file's 422/401 cases spend the allowance
    # too, and the seven DELETE /v1/fyp/interests stages would blow that endpoint's
    # 5/minute and start returning 429. A peer absent from this list has its header
    # ignored -- correctly, and silently, which presents as the limits simply not
    # working, so the value has to be right rather than approximately right.
    # ::1 is belt-and-braces only: `uvicorn --host 0.0.0.0` binds AF_INET, so a v6
    # loopback peer cannot actually reach it. Harmless, and survives someone
    # switching the bind to `::`.
    TRUSTED_PROXY_IPS: "127.0.0.1,::1"
  script:
    - pip install -r requirements.txt pytest -q
    - sleep 5
    - |
      python3 -c "
      import psycopg2, os
      c = psycopg2.connect(host=os.environ['POSTGRES_HOST'], port=os.environ['POSTGRES_PORT'],
                           dbname=os.environ['POSTGRES_DB'], user=os.environ['POSTGRES_USER'],
                           password=os.environ.get('POSTGRES_PASSWORD',''))
      c.autocommit = True
      c.cursor().execute(open('tests/haf_stub.sql').read())
      c.cursor().execute(open('tests/ci_fastapi_setup.sql').read())
      # #16: the real SECURITY DEFINER reader GET /sync-status calls. Loaded from
      # db/ (not restubbed) so the tavern check exercises the shipped function body.
      c.cursor().execute(open('db/sync_status.sql').read())
      c.close()
      print('DB setup complete')
      "
    # pg-backed tests that load their own functions: feed-events rollup/retention
    # (#12) and embedding-coverage refresh (#15).
    - PYTHONPATH=. pytest tests/integration/ -v
    - PYTHONPATH=. uvicorn haf_fyp.api:app --host 0.0.0.0 --port 3002 &
    - sleep 3
    - echo 'variables:' > /tmp/tavern_cfg.yaml
    - 'echo "  fastapi_url: $FASTAPI_URL" >> /tmp/tavern_cfg.yaml'
    - 'echo "  api_url: $API_URL" >> /tmp/tavern_cfg.yaml'
    - PYTHONPATH=. pytest tests/tavern/test_fastapi_endpoints.tavern.yaml --tavern-global-cfg=/tmp/tavern_cfg.yaml -v
  rules: *standard_rules

postgrest-tests:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # --build is load-bearing for LOCAL runs of this file: compose only builds when the
    # derived image is absent, so after the first run an edit to
    # endpoints/rewrite_rules.conf or Dockerfile.rewriter would be silently ignored and
    # the suite would go green on the OLD rules -- exactly the failure the rewriter
    # stages exist to catch (#44). In CI's ephemeral dind nothing is cached, so it
    # changes nothing there.
    - docker compose -f docker/docker-compose-ci.yml up --detach --build
    - docker compose -f docker/docker-compose-ci.yml wait tavern
  after_script:
    # postgres too: a setup refused by it (the healthcheck race docker-compose-ci.yml
    # describes) is otherwise
    # diagnosed without the server's own account of what it was doing.
    - docker compose -f docker/docker-compose-ci.yml logs postgres || true
    - docker compose -f docker/docker-compose-ci.yml logs setup
    - docker compose -f docker/docker-compose-ci.yml logs tavern
    # Turns "some path 404'd" into "that rule rewrote to X". `|| true` because
    # after_script runs under set -e: if the build failed the service has no
    # container, and a non-zero here would skip the `down -v` below.
    - docker compose -f docker/docker-compose-ci.yml logs haf-fyp-postgrest-rewriter || true
    - docker compose -f docker/docker-compose-ci.yml down -v
  rules: *standard_rules

# The installer and the uninstaller, run for real (#47): install; install again while a
# block processor's lock is held, which must do nothing; install again once it is
# released, over a database changed the way a node changes it; uninstall. A verify step
# after each. Until this job, nothing in CI ran scripts/install_app.sh or
# scripts/uninstall_app.sh against a database: the unit tests run them against a psql
# that records what it is handed, and docker-build-sql only asks them for --help.
# docker/docker-compose-ci-install.yml says what the lane covers and what it does not
# (the database is a model of HAF, not HAF).
#
# tests/unit/test_install_lane.py states this job and that compose file in full and
# compares: any change here has to be made there too.
#
# In the test stage, beside postgrest-tests, and independent of the build stage: it
# builds the SQL image itself, from this checkout, so it also runs when docker-build-sql
# would fail and says why sooner.
install-test:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Recorded by the installer in haf_fyp_app.app_version, and expected there by the
    # verify steps: the image's baked value, read back from the database.
    HAF_FYP_GIT_HASH: $CI_COMMIT_SHORT_SHA
  script:
    # `timeout` on both: a step that never exits (an installer waiting on a database, a
    # lock that is never released) would otherwise hold the job to GitLab's own limit
    # and report "job timeout" with no log from the step that hung.
    - timeout 900 docker compose -f docker/docker-compose-ci-install.yml up --detach --build
    # verify-gone is LAST in the chain, and every step waits for the one before it to
    # exit 0, so this is the whole lane. On a red lane `up` above has usually failed
    # already (compose stops at the first step that exits non-zero and names it); the
    # step's own log is in after_script below.
    - timeout 600 docker compose -f docker/docker-compose-ci-install.yml wait verify-gone
    # Exit 0 is not enough: a verify file that was emptied, or that quits at its first
    # line, exits 0 too. Each prints its sentence only once the comparison it reports
    # has been made (the uninstall check at its very end; the install check with one
    # section still to run, which its exit code answers for).
    # `grep -c`, not `grep -q`: -q stops reading at the first match, `docker compose
    # logs` then dies of SIGPIPE, and under the runner's `pipefail` the line FAILS for
    # having found what it looked for. -c reads to the end and exits 1 on a count of 0.
    - docker compose -f docker/docker-compose-ci-install.yml logs verify | grep -Ec "first install. [0-9]{3,} items recorded"
    - docker compose -f docker/docker-compose-ci-install.yml logs verify-locked | grep -Ec "phase locked. all [0-9]{3,} items identical to the first install"
    - docker compose -f docker/docker-compose-ci-install.yml logs verify-again | grep -Ec "phase second. all [0-9]{3,} items identical to the first install"
    - docker compose -f docker/docker-compose-ci-install.yml logs verify-gone | grep -c "haf_fyp is gone and nothing else was touched"
    - docker compose -f docker/docker-compose-ci-install.yml logs install-locked | grep -c "Skipping haf_fyp install"
    - docker compose -f docker/docker-compose-ci-install.yml logs install-again | grep -c "Acquired install lock for haf_fyp"
  after_script:
    - docker compose -f docker/docker-compose-ci-install.yml ps -a || true
    - docker compose -f docker/docker-compose-ci-install.yml logs postgres || true
    - docker compose -f docker/docker-compose-ci-install.yml logs db-setup || true
    - docker compose -f docker/docker-compose-ci-install.yml logs install || true
    - docker compose -f docker/docker-compose-ci-install.yml logs verify || true
    - docker compose -f docker/docker-compose-ci-install.yml logs age || true
    - docker compose -f docker/docker-compose-ci-install.yml logs lock-holder || true
    - docker compose -f docker/docker-compose-ci-install.yml logs install-locked || true
    - docker compose -f docker/docker-compose-ci-install.yml logs verify-locked || true
    - docker compose -f docker/docker-compose-ci-install.yml logs release-lock || true
    - docker compose -f docker/docker-compose-ci-install.yml logs install-again || true
    - docker compose -f docker/docker-compose-ci-install.yml logs verify-again || true
    - docker compose -f docker/docker-compose-ci-install.yml logs bystander-session || true
    - docker compose -f docker/docker-compose-ci-install.yml logs uninstall || true
    - docker compose -f docker/docker-compose-ci-install.yml logs verify-gone || true
    - docker compose -f docker/docker-compose-ci-install.yml down -v || true
  rules: *standard_rules


# The same lane against HAF itself (#47): docker/docker-compose-ci-install-haf.yml runs
# the steps above, with the same files, over the HAF release docker/.env pins for it
# (HAF_INSTALL_LANE_VERSION, what nodes run) instead of over a model of it. No replay: hived runs once to initialise the database and stops
# before it syncs. This is the job that says the installer works on HAF, and the one
# that goes red when HAF moves away from what install-test's model says it is.
#
# It pulls the HAF image (about 1.3 GB), which install-test does not; that is the cost
# of asking HAF instead of a model, and the reason there are two jobs and not one.
install-test-haf:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Recorded by the installer in haf_fyp_app.app_version, and expected there by the
    # verify steps: the image's baked value, read back from the database.
    HAF_FYP_GIT_HASH: $CI_COMMIT_SHORT_SHA
  script:
    # `timeout` on both: a step that never exits (an installer waiting on a database, a
    # lock that is never released) would otherwise hold the job to GitLab's own limit
    # and report "job timeout" with no log from the step that hung.
    - timeout 900 docker compose -f docker/docker-compose-ci-install-haf.yml up --detach --build
    # verify-gone is LAST in the chain, and every step waits for the one before it to
    # exit 0, so this is the whole lane. On a red lane `up` above has usually failed
    # already (compose stops at the first step that exits non-zero and names it); the
    # step's own log is in after_script below.
    - timeout 600 docker compose -f docker/docker-compose-ci-install-haf.yml wait verify-gone
    # Exit 0 is not enough: a verify file that was emptied, or that quits at its first
    # line, exits 0 too. Each prints its sentence only once the comparison it reports
    # has been made (the uninstall check at its very end; the install check with one
    # section still to run, which its exit code answers for).
    # `grep -c`, not `grep -q`: -q stops reading at the first match, `docker compose
    # logs` then dies of SIGPIPE, and under the runner's `pipefail` the line FAILS for
    # having found what it looked for. -c reads to the end and exits 1 on a count of 0.
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify | grep -Ec "first install. [0-9]{3,} items recorded"
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify-locked | grep -Ec "phase locked. all [0-9]{3,} items identical to the first install"
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify-again | grep -Ec "phase second. all [0-9]{3,} items identical to the first install"
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify-gone | grep -c "haf_fyp is gone and nothing else was touched"
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs install-locked | grep -c "Skipping haf_fyp install"
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs install-again | grep -c "Acquired install lock for haf_fyp"
  after_script:
    - docker compose -f docker/docker-compose-ci-install-haf.yml ps -a || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs haf-init || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs haf || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs db-setup || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs install || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs age || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs lock-holder || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs install-locked || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify-locked || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs release-lock || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs install-again || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify-again || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs bystander-session || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs uninstall || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml logs verify-gone || true
    - docker compose -f docker/docker-compose-ci-install-haf.yml down -v || true
  rules: *standard_rules

.docker-build:
  stage: build
  image: docker:24
  # Three jobs each push their own moving tag. Without a resource group two
  # overlapping default-branch pipelines race per-image and can leave the three
  # tags on DIFFERENT commits, which nothing detects. interruptible lets GitLab's
  # auto-cancel actually fire -- it only cancels pipelines whose jobs are all
  # interruptible, and the default is false, so today both run to completion.
  resource_group: registry-$CI_COMMIT_REF_SLUG
  interruptible: true
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules: *standard_rules

# Push only from the default branch. Merge-request pipelines still BUILD -- that is
# what catches a broken Dockerfile before review -- but publishing every MR commit
# would fill the registry with images nobody consumes and make the tag list useless
# for finding a deployable build.
#
# Two tags on a push:
#   :<short-sha>  immutable, what a deployment pins
#   :<default-branch>  moving, what a downstream tracks. Named from
#                     $CI_DEFAULT_BRANCH, slashes replaced -- docker tags cannot
#                     contain "/", so a default branch like release/1.0 would
#                     otherwise be an invalid reference and hard-fail the push.
# haf_fyp has no releases, so the branch tag is the honest stand-in for the
# ${..._VERSION} tag haf_api_node's compose files expect. Siblings differ here:
# haf_stats published short SHAs only until it added a release lane of its own (its
# #66); it now carries `1.29.0-rc2` as well. balance_tracker and
# reputation_tracker are mostly semver (50/132 and 5/71 sha) -- which is exactly
# why ${APP_VERSION:-${HIVE_API_NODE_VERSION}} has nothing to resolve to for us.
# publish_tag at the end of this file now turns a release tag into :<tag> images (#57);
# the branch tag remains what a downstream tracks between releases.
# A scalar, not a list: `- *anchor` then splices ONE string. Aliasing a list here
# would nest an array inside script:, which GitLab flattens but which reads as a
# mistake to anyone who does not know that.
.push-if-default-branch: &push_if_default_branch |
  if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
    BRANCH_TAG=$(echo "$CI_DEFAULT_BRANCH" | tr '/' '-')
    docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    docker tag  "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$BRANCH_TAG"
    docker push "$IMAGE:$BRANCH_TAG"
    echo "pushed $IMAGE:$CI_COMMIT_SHORT_SHA and :$BRANCH_TAG"
  else
    echo "not on $CI_DEFAULT_BRANCH - built only, not pushed"
  fi

docker-build-sql:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/sql
  script:
    # GIT_HASH -> ENV -> written to haf_fyp_app.app_version by install_app.sh step 15,
    # so GET /version names the commit the image was built from (#20). Short SHA to
    # match the tag.
    - docker build -f Dockerfile.sql
        --build-arg GIT_HASH="$CI_COMMIT_SHORT_SHA"
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
        --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
        --build-arg BUILD_TIME="$CI_JOB_STARTED_AT"
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Smoke-run the image (#27). Until this existed, NOTHING in CI ever started a
    # container from Dockerfile.sql -- compose-validate only parses YAML, the postgrest
    # lane builds from docker-compose-ci.yml, and the unit tests run the scripts on the
    # Debian runner. So a script that works on Debian and dies on the image's Alpine
    # userland passed every job. That is not hypothetical: an earlier revision of this
    # MR shipped `date --utc --iso-8601=seconds`, a GNU long option BusyBox does not
    # have, in the first line of process_blocks.sh -- which under `set -e` would have
    # crash-looped haf-fyp-sync on every deployment, forever.
    #
    # These run without a database on purpose, so they are fast and cannot flake: each
    # exercises a path that resolves before the first connection. Note what that rules
    # OUT -- `uninstall_app` with no --force calls wait_for_postgres BEFORE its no-TTY
    # refusal, so smoke-testing that path here would hang in an unbounded
    # `until pg_isready` loop rather than fail. It is covered by a unit test instead.
    #
    # NOTE: do NOT reach for `! cmd` to assert a failure here. Bash exempts a
    # !-inverted pipeline from errexit, so `! grep -q X file` passes whatever the file
    # contains -- that is the bug fixed below. Capture the status instead, which is what
    # expect_fail does.
    - |
      set -e
      IMG="$IMAGE:$CI_COMMIT_SHORT_SHA"
      # `run` wrapper: every assertion greps for a message. A bare `! docker run ...`
      # passes on ANY non-zero status, including 127 when the file is not in the image
      # -- so it would have "verified" a healthcheck that had never been COPYed. And
      # `timeout` because a job that hangs reports "job timeout" rather than a diff.
      expect_ok()   { timeout 60 docker run --rm "$IMG" "$@"; }
      # 124 is timeout's own kill, 125/126 are docker/exec failures, 127 is
      # "not found" -- none of them is the script rejecting its input. Excluding
      # them is the rule round two arrived at the hard way: an assertion whose
      # expected outcome is a non-zero exit must name a SPECIFIC reachable exit.
      expect_fail() { rc=0; timeout 60 docker run --rm "$IMG" "$@" >/tmp/o 2>&1 || rc=$?; cat /tmp/o; case "$rc" in 0|124|125|126|127) return 1 ;; *) return 0 ;; esac; }

      echo "--- entrypoint dispatches its own usage on stdout ---"
      expect_ok --help | grep -q "install_app"
      echo "--- unknown verb fails with the right message, not merely non-zero ---"
      expect_fail install-app; grep -q "unknown verb: install-app" /tmp/o
      echo "--- the scripts parse and render help under the image's BusyBox userland ---"
      expect_ok install_app   --help | grep -q -- "--swagger-url"
      expect_ok uninstall_app --help | grep -q -- "--force"
      expect_ok process_blocks --help | grep -q -- "--host"
      echo "--- an invalid option is rejected, not ignored ---"
      expect_fail install_app --nope; grep -q "is not a valid option" /tmp/o
      echo "--- the no-op module-file flags are accepted, not rejected ---"
      # --help AFTER them on purpose: the option loop processes every argument, so this
      # proves acceptance and then exits 0 WITHOUT reaching wait_for_postgres. Asserting
      # these with expect_fail instead hung the sibling app's docker-build for 58
      # minutes -- with nothing to exit at, the script fell into an unbounded
      # `until pg_isready` and `timeout` could not reap it through the container.
      for verb in install_app uninstall_app process_blocks; do
        expect_ok "$verb" --schema=btracker_app --is_forking=TRUE --help >/tmp/f 2>&1
        cat /tmp/f
        grep -q "WARNING: --schema" /tmp/f || { echo "FAIL: $verb did not warn on a foreign --schema"; exit 1; }
        grep -q "btracker_app" /tmp/f || { echo "FAIL: $verb did not name the ignored value"; exit 1; }
      done
      echo "--- but a connection URI is REFUSED, not half-honoured ---"
      # Honouring it moved only the psql connection: the messages and the teardown's
      # confirmation prompt still read POSTGRES_HOST/POSTGRES_DB, so it could act on one
      # database while reporting another. Refusing is safe -- --postgres-url appears in
      # one upstream module file, on a service with no restart policy.
      for verb in install_app uninstall_app process_blocks; do
        expect_fail "$verb" --postgres-url=postgresql://haf_admin@haf/haf_block_log
        grep -q "not supported yet" /tmp/o || { echo "FAIL: $verb did not refuse --postgres-url clearly"; exit 1; }
        grep -q -- "--host=" /tmp/o || { echo "FAIL: $verb did not name the alternative flags"; exit 1; }
      done
      echo "--- the compat path the LIVE node uses still dispatches ---"
      expect_ok /app/scripts/install_app.sh --help | grep -q -- "--swagger-url"
      echo "--- the healthcheck is present at the path module files hardcode ---"
      expect_ok test -r /app/block-processing-healthcheck.sql
      timeout 60 docker run --rm --entrypoint /app/block-processing-healthcheck.sh "$IMG" >/tmp/h 2>&1 && exit 1
      cat /tmp/h; grep -q "hasn.t started yet" /tmp/h
      echo "--- and fails CLOSED when it has a startup time but no database ---"
      # Greps, like every other assertion. Without it this passed on ANY non-zero --
      # including 124 (a 60s hang), 127, or the script exiting 1 because the .sql was
      # missing, which is precisely the case the assertion above it is meant to prove.
      timeout 60 docker run --rm -e HAF_FYP_STARTUP_TIME_FILE=/etc/hostname         --entrypoint /app/block-processing-healthcheck.sh "$IMG" >/tmp/h2 2>&1 && exit 1
      cat /tmp/h2
      # `psql: error:` is psql's own prefix for any connection failure, so this does not
      # depend on guessing the wording -- the first attempt matched four phrasings and
      # the image emitted a fifth ("could not translate host name"). Pairing it with the
      # negative assertion is what makes it precise: it proves the script reached psql
      # and psql failed, rather than the script exiting 1 down the missing-SQL-file path
      # that the assertion above it exists to rule out.
      grep -q "psql: error:" /tmp/h2
      # NOT `! grep -q ...`: bash exempts a !-inverted pipeline from errexit, so that
      # form passes whatever the file contains -- and it is the only thing separating
      # "failed closed for the right reason" from "failed because the SQL was never
      # COPYed into the image".
      if grep -q "healthcheck SQL not found" /tmp/h2; then
        echo "FAIL: healthcheck could not find its .sql -- COPY missing from Dockerfile"
        exit 1
      fi
      echo "image smoke tests passed"
    - *push_if_default_branch

docker-build-python:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/python
  script:
    - docker build -f Dockerfile.python
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
        --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
        --build-arg BUILD_TIME="$CI_JOB_STARTED_AT"
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - *push_if_default_branch

# The URL rewriter that fronts PostgREST, serving the clean /v1/fyp/... paths instead
# of raw /rpc/<function>. Dockerfile.rewriter and its inputs have existed all along but
# nothing ever built them, so deployments borrowed balance_tracker's rewriter image and
# bind-mounted endpoints/rewrite_rules.conf from the host. That is why a path change
# (e.g. #21's /v1/fyp/metrics -> /v1/fyp/feed-metrics) needed a node-side file edit
# rather than an image bump, and why host and repo could silently diverge.
docker-build-rewriter:
  extends: .docker-build
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/postgrest-rewriter
  script:
    - docker build -f Dockerfile.rewriter
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA"
        --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
        --build-arg GIT_LAST_LOG_MESSAGE="$CI_COMMIT_TITLE"
        --build-arg BUILD_TIME="$CI_JOB_STARTED_AT"
        --build-arg GIT_LAST_COMMITTER="$CI_COMMIT_AUTHOR"
        --build-arg GIT_LAST_COMMIT_DATE="$CI_COMMIT_TIMESTAMP"
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - *push_if_default_branch

# =============================================================================
# release
# =============================================================================
#
# Until this job existed, a tag pipeline did not exist. Every job above matches only
# `merge_request_event` or `$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH`; a tag pipeline sets
# CI_COMMIT_TAG and leaves CI_COMMIT_BRANCH unset, so nothing matched -- and GitLab does
# not create a pipeline with no jobs. The 1.29.0-rc2 tag (2026-09-16) produced no
# pipeline and published nothing, which is #57.
#
# RETAG, DO NOT REBUILD. The three images are built and tested per commit on the default
# branch, and this job re-tags those exact images. Rebuilding from the tag would publish
# bytes no lane ever ran -- a newer base layer, a different pip resolution -- under a
# name that claims to be the tested build. It is also why this job needs no test stage
# of its own: the commit being tagged already went green on develop.
#
# PULL AND TAG EVERYTHING BEFORE PUSHING ANYTHING. The three images are consumed as a
# set: the rewriter proxies paths that the SQL image's schema defines, and the python
# image serves them. A push that failed halfway would leave :<tag> resolving for some
# images and not others, and a deployment pinning it would mix versions. Pulling first
# turns the expected failure -- a tag on a commit whose images are not in the registry --
# into a failure before any tag is published.
#
# That failure is deliberate and loud (`set -e` over a failed `docker pull`). A tag on a
# commit that never ran a default-branch pipeline has no SHA images, and there is
# nothing honest to publish under a release name.
#
# NOT interruptible, unlike .docker-build. That template pushes a moving tag too, so the
# difference is not what it publishes: it is that its tags are rewritten by the next
# push to develop, which makes a cancelled run cheap. A release tag is written once and
# nothing re-runs it, so a cancel between two pushes leaves `:<tag>` skewed until a
# human notices.
#
# No resource_group either. The template needs one because two overlapping
# default-branch pipelines race per image and can leave the three moving tags on
# different commits; a second pipeline for the same release tag re-pushes identical
# digests instead, so serialising buys nothing. Re-cutting a tag onto a DIFFERENT commit
# would race, and moving a published release tag is already a mistake this job cannot
# make safe.
#
# GIT_STRATEGY: none because the job reads no file from the checkout, and
# dependencies: [] to state that it consumes no artifact -- defensive rather than a
# saving, since in a tag pipeline there is no earlier job to download from. No `needs:`
# either: this is the only job in that pipeline, so naming another would reference a job
# that does not exist there.
publish_tag:
  stage: release
  image: docker:24
  interruptible: false
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    GIT_STRATEGY: none
  dependencies: []
  retry:
    max: 2
    when: runner_system_failure
  before_script:
    # --password-stdin, unlike .docker-build's `-p`: this job is new, and the flag form
    # puts the token in the job container's process list and prints docker's own warning.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -e
      # A docker tag cannot contain "/", so a git tag like `1.29/rc2` -- which the rule
      # below accepts -- would die inside `docker tag` with docker's own message about an
      # invalid reference. This file already handles that class for branch names at
      # .push-if-default-branch (`tr '/' '-'`), but renaming is wrong HERE: the published
      # tag has to be the release name people look for, not a mangled variant of it. So
      # refuse early and say why.
      case "$CI_COMMIT_TAG" in
        */*)
          echo "refusing to publish: tag '$CI_COMMIT_TAG' contains '/', which is not a valid docker tag"
          exit 1
          ;;
      esac
      for repo in "$CI_REGISTRY_IMAGE/sql" "$CI_REGISTRY_IMAGE/python" "$CI_REGISTRY_IMAGE/postgrest-rewriter"; do
        docker pull "${repo}:${CI_COMMIT_SHORT_SHA}"
        docker tag  "${repo}:${CI_COMMIT_SHORT_SHA}" "${repo}:${CI_COMMIT_TAG}"
      done
      for repo in "$CI_REGISTRY_IMAGE/sql" "$CI_REGISTRY_IMAGE/python" "$CI_REGISTRY_IMAGE/postgrest-rewriter"; do
        docker push "${repo}:${CI_COMMIT_TAG}"
        echo "published ${repo}:${CI_COMMIT_TAG}"
      done
  # GATED ON THE TAG'S SHAPE, NOT ON CI_COMMIT_REF_PROTECTED, which is what hive/haf_stats
  # uses. This project had no protected-tag rule when the lane was written, so gating on
  # protection would have made it dead code -- green, never running -- the failure mode #57
  # is about. `1.*` and `v*` (create: Maintainers) were added on 2026-09-29 for #72, so
  # tightening to match haf_stats is now possible -- but a release shape they do not cover
  # (`2.0.1`) would then publish nothing, so it waits until the rules cover every shape.
  #
  # `v?` because a shape gate fails the same silent way when it is too narrow: a tag it
  # does not match creates no job, so no pipeline, so no signal anywhere -- exactly #57.
  # hive/haf_api_node, which drives the release sweep, carries both spellings today
  # (`1.28.6-rc10` and `v1.28.6-rc11`), so both have to publish here.
  rules:
    # A GitLab pipeline schedule can target a TAG, not only a branch -- so this lane needs the
    # same exclusion .standard-rules carries, and for a sharper reason than the others: a
    # schedule pointed at a release tag would re-pull `:<short-sha>` and re-push all three
    # `:<tag>` images on a timer, republishing a release from unchanged source. Found by
    # review; an earlier revision of #63 asserted "nothing else in this file runs there",
    # which was true only for a BRANCH schedule.
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # And a pipeline run for the on-demand registry sweep, which on a tag would otherwise
    # re-publish that release too.
    - if: $RUN_REGISTRY_RESOLUTION == "true"
      when: never
    # The escape hatch haf_stats' publish lane carries: a tag that should not be
    # published can be stopped by re-running the pipeline with SKIP_DOCKER_PUBLISH set,
    # rather than by racing to cancel the job.
    - if: $SKIP_DOCKER_PUBLISH == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
      when: on_success
    - when: never

# =============================================================================
# publish
# =============================================================================
#
# MIRROR THE RELEASE TO registry-upload.hive.blog (#72). haf_api_node's haf_fyp module
# resolves its three images against ${HIVE_API_NODE_REGISTRY:-registry.hive.blog}/haf_fyp/...,
# which 404 until this runs, so every node has to override all three HAF_FYP_*_IMAGE
# variables today. scripts/publish_images.sh copies :<tag> across; its header says what it
# takes from common-ci's .docker_publish_job_template and where it differs.
#
# A LATER STAGE THAN publish_tag, not merely declared after it: the script pulls :<tag>,
# which publish_tag creates, and jobs in one stage run in parallel. With no needs:, GitLab
# starts it only once every earlier stage has succeeded.
#
# GATED ON A PROTECTED TAG AND ON THE CREDENTIALS. BLOG_REGISTRY_USER/PASSWORD are
# PROTECTED project variables, which GitLab passes only to pipelines for protected refs.
# The protected-tag rules here are `1.*` and `v*` (Settings > Repository > Protected tags,
# create: Maintainers, added for #72). A release tag neither covers -- `2.0.1` -- gets no
# credentials, and rather than letting the job run without them, publish_images_skipped
# runs and says so; adding a rule for that shape is all it takes. Every operand of the
# credential test is an explicit comparison: in a GitLab && chain a bare $VAR is only tested for being DEFINED unless it is
# the last operand, which is how haf_stats once created its mirror job with an empty user.
publish_images:
  stage: publish
  image: docker:24
  interruptible: false
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies: []
  retry:
    max: 2
    when: runner_system_failure
  script:
    - sh scripts/publish_images.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RUN_REGISTRY_RESOLUTION == "true"
      when: never
    - if: $SKIP_DOCKER_PUBLISH == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/ && $CI_COMMIT_REF_PROTECTED == "true" && $BLOG_REGISTRY_USER != null && $BLOG_REGISTRY_USER != "" && $BLOG_REGISTRY_PASSWORD != null && $BLOG_REGISTRY_PASSWORD != ""
      when: on_success
    - when: never

# The visible half of that gate. Without it a release tag that cannot be mirrored produces
# SILENCE -- publish_images is not created and the pipeline looks complete. Green on
# purpose: an unmirrored release is a known, tracked state, not a build failure. Its rules
# are publish_images' own, with the positive rule turned into `never`, so exactly one of
# the two runs for any release tag (tests/unit/test_publish_images.py walks the states).
publish_images_skipped:
  stage: publish
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  dependencies: []
  script:
    - |
      if [ "${CI_COMMIT_REF_PROTECTED:-}" != "true" ]; then
        echo "MIRROR SKIPPED - tag ${CI_COMMIT_TAG} is not protected, so GitLab withholds the"
        echo "protected BLOG_REGISTRY_USER/BLOG_REGISTRY_PASSWORD variables from its pipeline."
        echo "Add a protected-tag rule matching it (Settings > Repository > Protected tags)."
      else
        echo "MIRROR SKIPPED - BLOG_REGISTRY_USER/BLOG_REGISTRY_PASSWORD are not set."
      fi
      echo "${CI_COMMIT_TAG} was NOT mirrored to registry-upload.hive.blog; the GitLab"
      echo "registry images were published normally by publish_tag. See #72."
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $RUN_REGISTRY_RESOLUTION == "true"
      when: never
    - if: $SKIP_DOCKER_PUBLISH == "true"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/ && $CI_COMMIT_REF_PROTECTED == "true" && $BLOG_REGISTRY_USER != null && $BLOG_REGISTRY_USER != "" && $BLOG_REGISTRY_PASSWORD != null && $BLOG_REGISTRY_PASSWORD != ""
      when: never
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+/
      when: on_success
    - when: never

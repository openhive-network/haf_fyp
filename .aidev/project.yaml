# Profile for hive/haf_fyp, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: haf-fyp

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/haf_fyp"
  id: 603

# AIDEV integrates into its own branch and hands it off to develop by merge
# request (`aidev handoff`: it opens the MR gated by the project CI), as in
# hive/nft_tracker, hive/reputation_tracker and hive/balance_tracker. `stable` is
# omitted, so `aidev release` never moves develop or main; develop -> main stays
# the project's own process.
branches:
  integration: "aidev/integration"
  handoff: "develop"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # Built by .aidev/runtime/build.sh from .aidev/runtime/Dockerfile and requirements.txt.
  image: "registry.gitlab.syncad.com/hive/haf_fyp/aidev-tests@sha256:f4c4e16f2f42b9b8dd5a0559059fe9d3cea81927c207ef96aeb408924f565dc5"
  inputs: [".aidev/runtime/Dockerfile", "requirements.txt"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# The service stack the slots that run haf_fyp's database lanes start (aidev#9890):
# the long-running servers of CI's fastapi-tests, postgrest-tests, install-test and
# install-test-haf jobs, one set per lane — PostgreSQL 14 for the FastAPI tests,
# pgvector 14 + PostgREST + the rewriter built from the candidate's
# Dockerfile.rewriter, pgvector 18 as the model of HAF, and HAF itself (docker/.env's
# HAF_INSTALL_LANE_VERSION, initialised with --exit-before-sync, nothing replayed).
# The lanes' one-shot steps run in the runtime image, which joins the stack's
# network. Slots that only lint and unit-test say `stack: false`. See
# .aidev/README.md.
sandbox:
  compose: .aidev/test-stack.compose.yml
  # Idle databases and one PostgREST; nothing replayed.
  resource_class: light
  services: [fastapi-db, postgres, haf-fyp-postgrest, haf-fyp-postgrest-rewriter, install-db, haf-init, haf]
  readiness_timeout: 300
  # The replay steps of full and canary reach the shared HAF the `haf` project hosts (a
  # HAF replayed to block 5000000) as AIDEV_EXTERNAL_HAF_HOST/_PORT: .aidev/run-checks.sh
  # takes two copy-on-write clones of it per run, installs the candidate into both as
  # haf_shared_consumer, processes blocks 1 to 5000000 in each and drops them on exit.
  # The consumer role is trusted from the fleet LAN: no secret. See .aidev/README.md.
  external:
    - name: haf
      provider: "haf/haf"

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Every step except stack-pins, aidev-scripts and the replay-* steps is a job of
# .gitlab-ci.yml, run from that file (.aidev/ci_job.py): the lint jobs, python-tests
# (`unit`), and for full, baseline and canary the four database lanes. full and canary
# also run the replay over clones of the shared HAF (replay-install, replay-sync,
# replay-parity, replay-report), which no CI job does. Not bound: haf-shim-drift
# (fetches hive/haf over the network; its offline half is in the unit tests), the
# docker-build-* image smoke tests (they need a docker daemon) and the scheduled
# jobs. See .aidev/README.md.
verification:
  quick:
    adapter: command
    # lints ~10 s + python-tests ~290 s (CI 302 s): above the 300 s base wall
    timeout: 900
    args: [".aidev/run-checks.sh", "quick", "stack-pins", "aidev-scripts", "sql-lint", "shell-lint", "python-lint", "hadolint", "compose-validate", "openapi-drift", "unit"]
    stack: false
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    reports: ["test-results/full/processor-timings.json"]
    # measured 9m11-9m17 locally plus the stack's boot (~30 s), and 7m39 for the replay
    # steps by hand on 2026-10-25 (install 36 s, the two 5M-block syncs side by side
    # 413 s, parity 7 s): about 17 min. 2100 s, the full ceiling, leaves 2x on that.
    timeout: 2100
    args: [".aidev/run-checks.sh", "full", "stack-pins", "aidev-scripts", "sql-lint", "shell-lint", "python-lint", "hadolint", "compose-validate", "openapi-drift", "unit", "fastapi", "postgrest", "install", "install-haf", "replay-install", "replay-sync", "replay-parity", "replay-report"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    # python-tests + the four lanes, ~9 min locally
    timeout: 1500
    args: [".aidev/run-checks.sh", "baseline", "unit", "fastapi", "postgrest", "install", "install-haf"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    reports: ["test-results/canary/processor-timings.json"]
    # as full, about 17 min; 1500 s is the canary cap, about 1.45x on that
    timeout: 1500
    args: [".aidev/run-checks.sh", "canary", "stack-pins", "aidev-scripts", "sql-lint", "shell-lint", "python-lint", "hadolint", "compose-validate", "openapi-drift", "unit", "fastapi", "postgrest", "install", "install-haf", "replay-install", "replay-sync", "replay-parity", "replay-report"]
    artifacts: ["test-results/canary/"]
  # python-tests with its pytest-cov run (coverage.xml beside the junit). `static`
  # and `system` are left unbound: AIDEV runs neither for a project.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "unit"]
    stack: false
    artifacts: ["test-results/coverage/"]

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []

---
test_name: POST /v1/fyp/events accepts a valid telemetry batch

stages:
  - name: signed-in batch of impression + action returns 202 accepted
    request:
      url: "{fastapi_url}/v1/fyp/events"
      method: POST
      json:
        session: "sess-abc-123"
        username: "alice"
        events:
          - t: "impression"
            post_id: 123
            rank: 4
            source: "personalized"
            algo_version: "v7"
            dwell_ms: 4200
            ts: 1751370000000
          - t: "action"
            post_id: 123
            kind: "vote"
            ts: 1751370005000
    response:
      status_code: 202
      json:
        accepted: 2

---
test_name: POST /v1/fyp/events accepts anonymous impressions (no username)

stages:
  - name: anonymous batch returns 202
    request:
      url: "{fastapi_url}/v1/fyp/events"
      method: POST
      json:
        session: "anon-xyz"
        events:
          - t: "video"
            post_id: 55
            watch_ms: 18000
            duration_ms: 62000
    response:
      status_code: 202
      json:
        accepted: 1

---
test_name: POST /v1/fyp/events validates the batch

stages:
  - name: empty events list returns 422
    request:
      url: "{fastapi_url}/v1/fyp/events"
      method: POST
      json:
        session: "s1"
        events: []
    response:
      status_code: 422

  - name: unknown event type returns 422
    request:
      url: "{fastapi_url}/v1/fyp/events"
      method: POST
      json:
        session: "s1"
        events:
          - t: "not-a-real-event"
            post_id: 1
    response:
      status_code: 422

  - name: missing session returns 422
    request:
      url: "{fastapi_url}/v1/fyp/events"
      method: POST
      json:
        events:
          - t: "impression"
            post_id: 1
    response:
      status_code: 422

  - name: out-of-range ts returns 422 (must not reach fromtimestamp -> 500)
    request:
      url: "{fastapi_url}/v1/fyp/events"
      method: POST
      json:
        session: "s1"
        events:
          - t: "impression"
            post_id: 1
            ts: 1000000000000000000
    response:
      status_code: 422

---
test_name: FastAPI sync-status reports the haf_fyp HAF context (#16)

# Asserts exact values, unlike the /metrics smoke test above: the fixture is
# seeded deterministically by tests/ci_fastapi_setup.sql and nothing in this job
# advances it. That makes this the one place the wire format is pinned against a
# real PostgreSQL — a regression in the timestamp formatting (an offset suffix,
# microseconds, a space instead of the literal T) fails here.
#
# NOT covered here: the privilege model. This lane's postgres role is a superuser
# and hafd.contexts is a stub without RLS, so grants and policies are bypassed
# entirely — see the header of tests/ci_fastapi_setup.sql. The real check is the
# post-install assertion in scripts/install_app.sh.
stages:
  - name: GET /sync-status returns the context block and its UTC timestamp
    request:
      url: "{fastapi_url}/sync-status"
      method: GET
    response:
      status_code: 200
      headers:
        cache-control: "public, max-age=0"
      json:
        last_block_num: 5000000
        last_block_time: "2016-09-15T19:47:21"

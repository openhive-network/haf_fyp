---
# EVERY request to a rate-limited endpoint below carries its own X-Real-IP.
#
# Since #28 the limit is charged BEFORE the body is parsed, so the 422/401
# rejection paths this file is mostly made of now spend the caller's allowance.
# From one address the seven DELETE /v1/fyp/interests cases alone would exceed
# that endpoint's 5/minute and start answering 429 instead of the status each
# case is asserting -- so each stage presents itself as a distinct client, which
# is also how these limits behave in production. The job sets TRUSTED_PROXY_IPS
# to the loopback for the header to be honoured; without it the app correctly
# ignores X-Real-IP and keys on the peer, and the DELETE cases go red.
#
# Addresses are from TEST-NET-2 and TEST-NET-3 (198.51.100.0/24 and 203.0.113.0/24,
# RFC 5737) and are per-stage, not per-endpoint. Adding a stage means adding an unused
# address, not reusing one.

test_name: FastAPI health returns ok

stages:
  - name: GET /health returns 200 with status ok
    request:
      url: "{fastapi_url}/health"
      method: GET
    response:
      status_code: 200
      # database comes from a real query through the pool (#61). This job runs
      # without a Redis and without REDIS_URL, so the limiter counts in memory and
      # needs no Redis: /health stays 200 with the refresh-signal Redis unreachable.
      json:
        status: "ok"
        database: "ok"
        redis: "unreachable"
        rate_limit_store: "memory"

---
test_name: FastAPI metrics returns 200 (#15 embedding coverage)

# Values are a smoke test -- the DB state depends on the integration test that ran
# just before this in the same job -- but the ranking_sources SHAPE and the
# privilege verdicts are asserted, because this is the only lane where the catalog
# probe runs against a real PostgreSQL (#36, #43).
#
# What it gates and what it does not: both probes DO run here and their sections are
# asserted non-null, so a query that raised (and was swallowed into None) fails this
# stage. What it cannot check is whether they return the RIGHT answer -- this stack
# has no hivemind_app, so nothing here depends on the values.
# tests/integration/test_servability_db.py pins the semantics against a real
# database; an earlier revision of this comment claimed the sections were null,
# which was simply wrong.
stages:
  - name: GET /metrics returns 200
    request:
      url: "{fastapi_url}/metrics"
      method: GET
    response:
      status_code: 200
      json:
        embedding_coverage: !anything
        recent_window_pct: !anything
        suspected_hole_days: !anything
        computed_at: !anything
        credibility_sources: !anything
        ranking_sources:
          # ABSENT, not unreadable: kept apart because the remedies are opposite --
          # install hivemind vs re-run grant_cross_schema.sh -- and an earlier
          # revision collapsed them, which would have sent an operator to fix a
          # grant on a node that has no hivemind at all.
          #
          # No `feeds_empty` here, deliberately. #36 shipped that boolean and #43
          # tried to make it authoritative; it was wrong in BOTH directions, so the
          # payload reports two independent observations and `degraded` is the
          # alert field. See build_ranking_sources_report's docstring.
          state: "ranking_no_feed"
          degraded: true
          # Asserted non-null, which is what this stage really gates: an absent
          # hivemind short-circuits the state/detail choice, but the probe still
          # runs, so a malformed query would surface as a null section (the probe
          # swallowed an error) instead of this object. Typed rather than exact,
          # because the row counts depend on whichever integration test ran last.
          global_feed:
            cached: !anybool
            servable: !anybool
          sources:
            hivemind: "absent"
            hivesense: "readable"
            resolver_inputs:
              hivemind_app.hive_accounts: "absent"
              hivemind_app.hive_permlink_data: "absent"
          detail: !anystr
        # #86. This is the only lane where the real probe runs through the real route
        # and the real pool, and `state: ok` is what it gates: a probe that raised is
        # swallowed into "unknown". Typed rather than exact, because the rotation is
        # whatever the integration tests left (empty, so the ages are null).
        reader_first:
          state: "ok"
          window_seconds: 86400
          due_after_seconds: 600
          retention_days: 30
          readers_in_window: !anyint
          readers_due: !anyint
          oldest_reader_feed_seconds: !anything
          rotation_size: !anyint
          never_ranked: !anyint
          rotation_age_seconds: !anything
          newest_feed_seconds: !anything
          notification_queue_usage: !anyfloat
        # Whether the installed feed_cache is the compact row (#99). Not pinned: this
        # lane's feed_cache is the cut-down table of ci_fastapi_setup.sql, and the
        # verdict is tested against PostgreSQL in test_feed_cache_format_db.py.
        feed_cache: !anything
      # credibility_sources is a LIVE privilege probe, so a cached answer would keep
      # reporting degraded=false after a grant is lost (or true after it is repaired),
      # defeating the point of re-probing every request. Pinned here for the same
      # reason /sync-status pins it below: without this, deleting the header — or the
      # `response: Response` parameter that carries it — leaves the suite green.
      headers:
        cache-control: "public, max-age=0"

---
test_name: POST /v1/fyp/interests requires a signature

# The happy path needs a posting-key signature matching a real on-chain account,
# which CI cannot produce; it is covered by tests/unit/test_auth.py. Here we
# assert the endpoint rejects unauthenticated and invalid requests.
stages:
  - name: POST without signature/timestamp returns 422
    request:
      url: "{fastapi_url}/v1/fyp/interests"
      method: POST
      headers:
        X-Real-IP: "198.51.100.10"
      json:
        username: "testuser"
        communities: [1234, 5678]
    response:
      status_code: 422


---
test_name: FastAPI sync-status reports the haf_fyp HAF context (#16)

# Asserts exact values, unlike the /metrics smoke test above: the fixture is
# seeded deterministically by tests/ci_fastapi_setup.sql and nothing in this job
# advances it. That makes this the one place the wire format is pinned against a
# real PostgreSQL — a regression in the timestamp formatting (an offset suffix,
# microseconds, a space instead of the literal T) fails here.
#
# NOT covered here: the privilege model. This lane's postgres role is a superuser
# and hafd.contexts is a stub without RLS, so grants and policies are bypassed
# entirely — see the header of tests/ci_fastapi_setup.sql. The real check is the
# post-install assertion in scripts/install_app.sh.
stages:
  - name: GET /sync-status returns the context block and its UTC timestamp
    request:
      url: "{fastapi_url}/sync-status"
      method: GET
    response:
      status_code: 200
      headers:
        cache-control: "public, max-age=0"
      json:
        last_block_num: 5000000
        last_block_time: "2016-09-15T19:47:21"

---
test_name: A rejected request spends the caller's allowance (#28)

# The end-to-end assertion for #28, through uvicorn rather than TestClient: before
# the fix these six malformed bodies were all answered 422 for free, because
# slowapi only ran once FastAPI had already parsed and rejected the request. That
# made every validation failure an unmetered amplifier -- worst on the
# unauthenticated /v1/fyp/events, where a 4 MB batch cost ~700 ms and returned a
# ~3.9 MB error while charging nothing.
#
# DELETE /v1/fyp/interests is the probe because its 5/minute is the smallest limit
# in the app, so the boundary is reached in six requests rather than 121.
# .60 is used by this test alone -- the stages above are all on distinct addresses,
# so nothing else has spent this bucket.
stages:
  - &spend
    name: malformed body 1 of 5 - 422, and charged
    request:
      url: "{fastapi_url}/v1/fyp/interests"
      method: DELETE
      headers:
        X-Real-IP: "198.51.100.60"
      json:
        username: "testuser"
    response:
      status_code: 422
  - <<: *spend
    name: malformed body 2 of 5 - 422, and charged
  - <<: *spend
    name: malformed body 3 of 5 - 422, and charged
  - <<: *spend
    name: malformed body 4 of 5 - 422, and charged
  - <<: *spend
    name: malformed body 5 of 5 - 422, and charged
  - name: the allowance is now gone, so the sixth is refused before it is parsed
    request:
      url: "{fastapi_url}/v1/fyp/interests"
      method: DELETE
      headers:
        X-Real-IP: "198.51.100.60"
      json:
        username: "testuser"
    response:
      status_code: 429

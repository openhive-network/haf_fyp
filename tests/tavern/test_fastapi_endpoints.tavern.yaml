---
test_name: FastAPI health returns ok

includes:
  - !include common.yaml

stages:
  - name: GET /health returns 200 with status ok
    request:
      url: "{fastapi_url}/health"
      method: GET
    response:
      status_code: 200
      json:
        status: "ok"

---
test_name: POST /v1/fyp/interests saves user interests

includes:
  - !include common.yaml

stages:
  - name: POST with valid body returns username and saved count
    request:
      url: "{fastapi_url}/v1/fyp/interests"
      method: POST
      json:
        username: "testuser"
        communities: [1234, 5678]
    response:
      status_code: 200
      json:
        username: "testuser"
        communities_saved: 2

---
test_name: POST /v1/fyp/interests rejects empty communities list

includes:
  - !include common.yaml

stages:
  - name: POST with empty communities returns 422
    request:
      url: "{fastapi_url}/v1/fyp/interests"
      method: POST
      json:
        username: "testuser"
        communities: []
    response:
      status_code: 422

---
test_name: POST /v1/fyp/interests rejects missing body

includes:
  - !include common.yaml

stages:
  - name: POST without body returns 422
    request:
      url: "{fastapi_url}/v1/fyp/interests"
      method: POST
    response:
      status_code: 422

---
test_name: POST /v1/fyp/interests rejects username exceeding 16 characters

includes:
  - !include common.yaml

stages:
  - name: POST with username longer than 16 chars returns 422
    request:
      url: "{fastapi_url}/v1/fyp/interests"
      method: POST
      json:
        username: "this-name-is-toolong"
        communities: [1234]
    response:
      status_code: 422

---
test_name: POST /v1/fyp/admin/algorithm requires X-Admin-Key header

includes:
  - !include common.yaml

stages:
  - name: POST without X-Admin-Key header returns 422
    request:
      url: "{fastapi_url}/v1/fyp/admin/algorithm"
      method: POST
      json:
        version: "1.0.0"
    response:
      status_code: 422

---
test_name: POST /v1/fyp/admin/algorithm rejects wrong admin key

includes:
  - !include common.yaml

stages:
  - name: POST with wrong X-Admin-Key returns 403
    request:
      url: "{fastapi_url}/v1/fyp/admin/algorithm"
      method: POST
      headers:
        X-Admin-Key: "wrong-key"
      json:
        version: "1.0.0"
    response:
      status_code: 403
      json:
        detail: "invalid admin key"

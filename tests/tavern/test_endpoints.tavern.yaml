---
test_name: Health check — PostgREST

includes:
  - !include common.yaml

stages:
  - name: GET /rpc/get_health returns 200 with status ok
    request:
      url: "{api_url}/rpc/get_health"
      method: GET
    response:
      status_code: 200
      json:
        - status: "ok"
          last_processed_block: !anything
          # Not !anything: that matches null, which is what #20 reported here.
          version: "ci-test"


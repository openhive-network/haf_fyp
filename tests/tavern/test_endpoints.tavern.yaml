---
test_name: Version endpoint

includes:
  - !include common.yaml

stages:
  - name: GET /rpc/get_version returns the installed hash, not null
    request:
      url: "{api_url}/rpc/get_version"
      method: GET
    response:
      status_code: 200
      # Assert the value, not just the status. #20 shipped null through this endpoint for
      # the life of the app while a status_code-only check stayed green. 'ci-test' is what
      # tests/set_version.sql writes -- the statement install_app.sh step 15 runs.
      json: "ci-test"


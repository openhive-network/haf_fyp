---
test_name: Health check — PostgREST

includes:
  - !include common.yaml

stages:
  - name: GET /rpc/get_health returns 200 with status ok
    request:
      url: "{api_url}/rpc/get_health"
      method: GET
    response:
      status_code: 200
      json:
        - status: "ok"
          last_processed_block: !anything
          version: !anything

---
test_name: Algorithm version endpoint

includes:
  - !include common.yaml

stages:
  - name: GET /rpc/get_algorithm returns v1.0.0
    request:
      url: "{api_url}/rpc/get_algorithm"
      method: GET
    response:
      status_code: 200

---
test_name: Personalized feed returns empty array before ranker runs

includes:

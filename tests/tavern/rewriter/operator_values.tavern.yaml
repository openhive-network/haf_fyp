---
# VALUES THAT LOOK LIKE POSTGREST OPERATORS REACH THE FUNCTION AS ARGUMENTS.
#
# PostgREST reads a GET query value that starts with an operator prefix (`not.`, `eq.`,
# ...) as a filter on the result, never as an argument. The rewrite rules move a path
# segment into the query (/v1/fyp/profile/X -> /rpc/get_user_profile?username=X), so
# before the rewriter forwarded declared arguments as a form POST (hive.rpc_form), the
# account "not.blocktrades" never reached get_user_profile: PostgREST answered PGRST100 or
# PGRST202 instead of the function's own result. Every stage below asserts the function's
# answer, so an error status from PostgREST fails it.
#
# The CI fixture has no profile or feed-cache rows, so every account here, real or not,
# gets the function's "no profile yet" answer: one row of defaults from get_user_profile,
# an empty array from get_score_explanation. That is the answer the app gives for an
# account it does not know, and the value is asserted, not just the status.

test_name: rewriter - operator-prefixed account names reach get_user_profile

includes:
  - !include ../common.yaml

stages:
  - name: not.blocktrades is an account name, not a filter
    request: {url: "{rewriter_url}/v1/fyp/profile/not.blocktrades", method: GET}
    response:
      status_code: 200
      json:
        - {has_feed: false, has_vector: false, posts_sampled: 0, top_communities: null, updated_at: null}

  - name: eq.blocktrades is an account name, not a filter
    request: {url: "{rewriter_url}/v1/fyp/profile/eq.blocktrades", method: GET}
    response:
      status_code: 200
      json:
        - {has_feed: false, has_vector: false, posts_sampled: 0, top_communities: null, updated_at: null}

  - name: a plain account name still answers as it did
    request: {url: "{rewriter_url}/v1/fyp/profile/blocktrades", method: GET}
    response:
      status_code: 200
      json:
        - {has_feed: false, has_vector: false, posts_sampled: 0, top_communities: null, updated_at: null}

---
test_name: rewriter - operator-prefixed account names reach get_score_explanation

includes:
  - !include ../common.yaml

stages:
  - name: not.blocktrades reaches get_score_explanation with its post_id
    # Two path segments, both arguments: both go to the body, in their own fields.
    request: {url: "{rewriter_url}/v1/fyp/explain/not.blocktrades/1", method: GET}
    response:
      status_code: 200
      json: []

  - name: eq.blocktrades reaches get_score_explanation with its post_id
    request: {url: "{rewriter_url}/v1/fyp/explain/eq.blocktrades/1", method: GET}
    response:
      status_code: 200
      json: []

---
test_name: rewriter - operator-prefixed account names reach get_personalized_feed

includes:
  - !include ../common.yaml

stages:
  - name: not.blocktrades reaches get_personalized_feed
    request:
      url: "{rewriter_url}/v1/fyp/feed/not.blocktrades"
      method: GET
      params: {page-size: "1"}
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_content
        extra_kwargs:
          comparisons:
            - {jmespath: "type(@)", operator: "eq", expected: "array"}

  - name: eq.blocktrades reaches get_personalized_feed
    request:
      url: "{rewriter_url}/v1/fyp/feed/eq.blocktrades"
      method: GET
      params: {page-size: "1"}
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_content
        extra_kwargs:
          comparisons:
            - {jmespath: "type(@)", operator: "eq", expected: "array"}

---
test_name: rewriter - a column filter beside an argument stays a filter

includes:
  - !include ../common.yaml

# The argument (username, from the path) goes to the form body; has_feed is a COLUMN of
# get_user_profile's result, not a parameter, so it must stay in the query where
# PostgREST applies it to the row. Sent as an argument it would be PGRST202 -> 404; dropped,
# the non-matching probe would answer the row instead of [].

stages:
  - name: a matching column filter keeps the row
    request:
      url: "{rewriter_url}/v1/fyp/profile/blocktrades"
      method: GET
      params: {has_feed: "eq.false", select: "has_feed,posts_sampled"}
    response:
      status_code: 200
      json:
        - {has_feed: false, posts_sampled: 0}

  - name: a non-matching column filter removes it
    request:
      url: "{rewriter_url}/v1/fyp/profile/blocktrades"
      method: GET
      params: {has_feed: "eq.true"}
    response:
      status_code: 200
      json: []

---
test_name: rewriter - HEAD answers the GET's status with no body

includes:
  - !include ../common.yaml

# The rewriter turns a HEAD into a POST to reach the function, and an answer to a POST
# carries a body. The stages share one keep-alive connection (one session per test), so a
# body left on the HEAD's answer would be read as the start of the next answer and break
# the GET that follows: that GET is the framing check, not a repeat.

stages:
  - name: HEAD answers 200
    request: {url: "{rewriter_url}/v1/fyp/profile/not.blocktrades", method: HEAD}
    response: {status_code: 200}

  - name: the next GET on the connection is framed correctly
    request: {url: "{rewriter_url}/v1/fyp/profile/not.blocktrades", method: GET}
    response:
      status_code: 200
      json:
        - {has_feed: false, has_vector: false, posts_sampled: 0, top_communities: null, updated_at: null}

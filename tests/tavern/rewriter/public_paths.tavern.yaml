    # `source` is declared by get_feed_metrics alone.
    request:
      url: "{rewriter_url}/v1/fyp/feed-metrics"
      method: GET
      params: {source: "global"}
    response: {status_code: 200}

  - name: /v1/fyp/feed-metrics is anchored - a suffix does not reach it

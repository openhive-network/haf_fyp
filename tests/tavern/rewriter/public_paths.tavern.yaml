---
test_name: rewrite rule - /v1/fyp/profile/<username>

includes:
  - !include ../common.yaml

stages:
  - name: /v1/fyp/profile/<username> reaches get_user_profile
    # posts_sampled is returned by get_user_profile alone. The username is deliberately
    # absent from the fixture: this asserts ROUTING, and the function returns exactly one
    # row even for an account with no profile.
    request:
      url: "{rewriter_url}/v1/fyp/profile/nonexistent-routing-probe"
      method: GET
      params: {select: "posts_sampled"}
    response: {status_code: 200}

  - name: /v1/fyp/profile is anchored - a suffix does not reach it
    request: {url: "{rewriter_url}/v1/fyp/profileXYZ", method: GET}
    response: {status_code: 404}

  - name: the username capture does not span a slash
    # ([^/]+) rather than (.+). Widening it is a plausible single edit in a generated
    # file, and no positive probe would notice: /profile/a/b would answer 200 for the
    # username "a/b". nginx replaces the WHOLE URI on a rewrite, so a widened capture
    # silently swallows the extra segment rather than 404ing.
    request: {url: "{rewriter_url}/v1/fyp/profile/nonexistent-routing-probe/extra", method: GET}
    response: {status_code: 404}

---
test_name: rewrite rule - /v1/fyp/feed/<username>

includes:
  - !include ../common.yaml

stages:
  - name: /v1/fyp/feed/<username> reaches get_personalized_feed
    # username + truncate_body together are declared by no other function: get_global_feed
    # has truncate_body but not username; get_user_profile and get_score_explanation have
    # username but not truncate_body.
    request:
      url: "{rewriter_url}/v1/fyp/feed/nonexistent-routing-probe"
      method: GET
      params: {page-size: "1", truncate_body: "1"}
    response: {status_code: 200}

  - name: /v1/fyp/feed is anchored - a suffix does not reach it
    request: {url: "{rewriter_url}/v1/fyp/feedXYZ", method: GET}
    response: {status_code: 404}

  - name: the username capture does not span a slash
    request: {url: "{rewriter_url}/v1/fyp/feed/nonexistent-routing-probe/extra", method: GET}
    response: {status_code: 404}

---
test_name: rewrite rule - /v1/fyp/warmup/<username>

includes:
  - !include ../common.yaml

stages:
  - name: /v1/fyp/warmup/<username> reaches warm_up_feed, which answers with no body
    # 204 is what PostgREST answers for a function that returns void; no other
    # function behind the rewriter does, so it is also what says the route is right.
    request:
      url: "{rewriter_url}/v1/fyp/warmup/nonexistent-routing-probe"
      method: GET
    response: {status_code: 204}

  - name: /v1/fyp/warmup is anchored - a suffix does not reach it
    request: {url: "{rewriter_url}/v1/fyp/warmupXYZ", method: GET}
    response: {status_code: 404}

  - name: the username capture does not span a slash
    request: {url: "{rewriter_url}/v1/fyp/warmup/nonexistent-routing-probe/extra", method: GET}
    response: {status_code: 404}

---
test_name: rewrite rule - /v1/fyp/explain/<username>/<post_id>

includes:
  - !include ../common.yaml

stages:
  - name: /v1/fyp/explain/<username>/<post_id> reaches get_score_explanation
    # score_credibility is returned by get_score_explanation alone. Both path segments
    # must survive as separate captures ($1 and $2).
    #
    # A TRANSPOSED rule (username=$2&post_id=$1) is caught, but by a type accident rather
    # than by design: post_id is BIGINT, so it fails the cast with 22P02. That only holds
    # while this probe's username is non-numeric -- keep it non-numeric.
    request:
      url: "{rewriter_url}/v1/fyp/explain/nonexistent-routing-probe/1"
      method: GET
      params: {select: "score_credibility"}
    response: {status_code: 200}

  - name: /v1/fyp/explain is anchored - a trailing segment does not reach it
    request:
      url: "{rewriter_url}/v1/fyp/explain/nonexistent-routing-probe/1/extra"
      method: GET
    response: {status_code: 404}

---
test_name: rewrite rule - the OpenAPI spec root

includes:
  - !include ../common.yaml

# `rewrite ^/$ / break;` exists solely to shield / from the catch-all below it. Delete it,
# or move it below the catch-all, and / becomes /rpc/ -> 404: the published API document
# -- the artefact the whole generator pipeline exists to produce, and the first thing a
# third party fetches -- stops being served, with every other stage green.
#
# Discriminated on CONTENT rather than status, so a repoint at some other 200-answering
# function is caught too.

stages:
  - name: / serves the OpenAPI document and is not proxied to a function
    request: {url: "{rewriter_url}/", method: GET}
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_content
        extra_kwargs:
          comparisons:
            - {jmespath: "type(openapi)", operator: "eq", expected: "string"}
            # root() sets `servers` at request time (#58). This lane loads no
            # haf_fyp_app.app_config, so it is the default, through PostgREST and as
            # the anonymous role.
            - {jmespath: "servers[0].url", operator: "eq", expected: "/haf-fyp-api"}
            - {jmespath: "length(servers)", operator: "eq", expected: 1}

---
test_name: rewrite rule - the catch-all

includes:
  - !include ../common.yaml

# `rewrite ^/(.*)$ /rpc/$1 break;` is the last rule and is load-bearing: README.md
# documents `<anything else> -> /rpc/<anything else>`, and /get_health answers 200 through
# the rewriter today while bare PostgREST 404s the same path.
#
# The anchor probes elsewhere in this file CANNOT stand in for this. They assert 404 on
# suffixed paths, and those 404 with or without the catch-all -- PGRST202 through it,
# 42P01 without it, same status either way. So deleting the catch-all left the entire
# earlier revision of this lane green. A POSITIVE probe is the only thing that pins it.

stages:
  - name: an unmapped function name is forwarded to /rpc/
    request:
      url: "{rewriter_url}/get_health"
      method: GET
      params: {select: "last_processed_block"}
    response: {status_code: 200}
